# 長尺（横 1920x1080）サンプル台本 ― 元動画「資料が届く人と届かない人は、何が違う？」を新設計で書き直したもの
id: "001"
kind: long
title: "資料が届かない理由は、最初の一通で決まる｜不動産屋に動いてもらう4行"
question: "資料が届く人と届かない人は、何が違う？"
note_url: "https://note.com/dokechi_hudousan"   # ← この回の元記事のURLに差し替える
thumbnail:
  big: "資料が\n届かない人"
  sub: "最初の一通で決まる"
publish:
  lead: "物件資料が届く人と届かない人の差は、最初の一通に何を入れたかで決まります。止まる場所3つと、入れる4行を架空の例で。"
  tags: [不動産投資, 大家, 一棟目, 小規模大家, 物件探し, 不動産屋, 問い合わせ]

scenes:
  # ---- フック（結論先出し。最初の15秒で「見ると何が得られるか」を言う）
  - id: hook
    layout: title
    heading: "資料が届かない理由は\n最初の一通で決まる"
    sub: "止まる場所3つ ＋ 入れる4行"
    lines:
      - {sp: 答, text: "物件資料が届く人と届かない人の差は、ほとんど最初の一通で決まります。"}
      - {sp: 聞, text: "一通で、ですか。"}
      - {sp: 答, text: "今日は、資料が止まる場所を3つに分けて、最初の一通に何を入れるかまで話します。見終わる頃には、4行のメモが書けるはずです。"}
      - {sp: 聞, text: "二人とも、説明のための架空の設定です。数字や例文も、説明用に変えてあります。"}

  # ---- 第1章
  - id: c1
    layout: chapter
    heading: "資料が止まる場所は3つ"
    lines:
      - {sp: 答, text: "まず、資料が来ないとき、どこで止まっているのか。だいたい3つのどれかです。"}

  - id: c1_list
    layout: list
    heading: "止まっている場所"
    items:
      - {text: "声をかけていない", note: "画面を見ているだけ"}
      - {text: "中身が伝わっていない", note: "何を出せばよいか不明"}
      - {text: "返さないまま次を頼む", note: "相手が後回しにする"}
    lines:
      - {sp: 答, text: "1つ目。そもそも声をかけていない。広く公開された画面を見ているだけ、という状態です。", step: 1}
      - {sp: 聞, text: "でも、公開されている物件を見るのは普通ですよね。"}
      - {sp: 答, text: "見ること自体は悪くありません。ただ、広く出ているものは、多くの人が見たあとのものです。相場をつかむ道具だと思ってください。"}
      - {sp: 答, text: "2つ目。声はかけたけれど、中身が伝わっていない。", step: 2}
      - {sp: 答, text: "3つ目。一度は資料が届いたのに、返事をしないまま次を頼んでしまう。", step: 3}
      - {sp: 聞, text: "3つとも、お金の話ではないんですね。"}
      - {sp: 答, text: "はい。伝える中身と、返す速さの話です。"}

  - id: c1_quote
    layout: quote
    heading: "よくある最初の一通"
    text: "「いい物件があれば、お願いします」"
    caption: "種類は？　金額は？　場所は？　→ 相手は何を出せばよいか決められない"
    lines:
      - {sp: 答, text: "2つ目の、中身が伝わっていない例です。送る側から見ると、この一文だけでは、誰に何を出せばよいかが決められません。", step: 1}
      - {sp: 答, text: "探している種類も、出せる額も、場所も分からないからです。", step: 2}

  # ---- 第2章
  - id: c2
    layout: chapter
    heading: "最初の一通に入れる4行"
    lines:
      - {sp: 答, text: "では、最初の一通に何を入れるか。4つの欄で考えます。"}

  - id: c2_list
    layout: list
    heading: "4つの欄"
    items:
      - {text: "誰か", note: "名前・会社員・初めての1件"}
      - {text: "いくらまで", note: "買える根拠をひと言"}
      - {text: "どこを", note: "広げすぎない"}
      - {text: "いつ返事できるか", note: "平日の夜・週末"}
    lines:
      - {sp: 答, text: "ここでの4つは、探している条件そのものではなく、条件を載せる一つ前の枠です。", step: 0}
      - {sp: 答, text: "1つ目の「誰か」は、名前と、会社員であること、初めての1件を探していることが分かれば足ります。", step: 1}
      - {sp: 聞, text: "名前だけでは足りませんか。"}
      - {sp: 答, text: "名前だけだと、相手には、どんな物件をどこまで出せる人なのかが分かりません。初めての1件だと分かれば、相手も出し方を決められます。"}
      - {sp: 答, text: "2つ目の「いくらまで」は、金額だけでなく、買える根拠をひと言添えると伝わります。自己資金がある、金融機関に相談を始めている、など。", step: 2}
      - {sp: 答, text: "3つ目の「どこを」。ここは広げすぎないのがコツです。", step: 3}
      - {sp: 聞, text: "広いほうが、数が増えそうですが。"}
      - {sp: 答, text: "数が増えるとは限りません。どこでもよい、と書かれると、相手はどれを当てればよいか決められないからです。"}
      - {sp: 答, text: "4つ目の「いつ返事できるか」は、平日の夜なら返せる、のように、返せる時間を書きます。", step: 4}

  - id: c2_bar
    layout: bar
    heading: "聞き返し1回 ＝ 約2日の遅れ"
    rows:
      - {label: "4つそろっている", value: 0.3, note: "0回 → 遅れ0日"}
      - {label: "どれかが欠けている", value: 2, note: "1回 → 2日"}
      - {label: "答えがまだ足りない", value: 4, note: "2回 → 4日"}
    lines:
      - {sp: 答, text: "この4つのどれかが欠けていると、相手は聞き返すところから始めます。", step: 1}
      - {sp: 答, text: "聞き返しが1往復入ると、だいたい2日遅れます。ここからの数字は説明のための置き方です。", step: 2}
      - {sp: 答, text: "答えがまだ足りなければ、もう1往復。4日です。その間に、ほかの人が同じ資料を見ているかもしれません。", step: 3, mark: 3}
      - {sp: 聞, text: "4つを先に入れておけば、その往復がなくなる、と。"}

  # ---- 第3章
  - id: c3
    layout: chapter
    heading: "届いたら、一行で返す"
    lines:
      - {sp: 答, text: "3つ目の止まる場所、返さないまま次を頼む、の話です。"}

  - id: c3_compare
    layout: compare
    left:  {title: "黙っている", tone: bad,  items: ["合わなかった？", "読んでいない？", "次の案内が出しにくい"]}
    right: {title: "一行で断る", tone: good, items: ["見送った理由が分かる", "次に出す条件が決まる", "次の案内につながる"]}
    lines:
      - {sp: 聞, text: "届いた資料、読んでもよく分からなくて、数日そのままにしてしまいそうです。", step: 1}
      - {sp: 答, text: "そう感じるのは自然です。けれど相手から見ると、黙っている人は、合わなかったのか、読んでいないのか、分かりません。"}
      - {sp: 答, text: "黙っているより、一行の断りのほうが、次の一通につながりやすいです。理由が一行あれば、次に何を出せばよいかも、相手に伝わります。", step: 2}

  - id: c3_quote
    layout: quote
    heading: "断りの一行（例文）"
    text: "拝見しました。今回は見送ります。\n駅から歩く時間が、探している条件より長いためです。"
    caption: "→ 次に出す物件の条件：駅から近い"
    lines:
      - {sp: 答, text: "たとえばこうです。拝見しました。今回は見送ります。駅から歩く時間が、探している条件より長いためです。", step: 1}
      - {sp: 答, text: "この一行で、相手は、次は駅から近いものを探せばよい、と分かります。", step: 2}
      - {sp: 聞, text: "断ることが、次の案内の材料になるんですね。"}

  # ---- まとめと今日の一歩
  - id: wrap
    layout: flow
    heading: "今日の話"
    items: ["声をかける", "4行を入れる", "一行で返す"]
    lines:
      - {sp: 答, text: "止まる場所は3つ。声をかけていない。中身が伝わっていない。返さないまま次を頼む。", step: 3}
      - {sp: 答, text: "中身は、最初の一通の4行で伝わります。届いたら、一行で返す。"}

  - id: ending
    layout: ending
    heading: "4つの欄を、自分の言葉で\n1行ずつ埋める"
    sub: "送るのは、そのあとで構いません"
    lines:
      - {sp: 答, text: "今日やることは1つです。最初の一通の4つの欄を、自分の言葉で1行ずつ埋めてみてください。送るのは、そのあとで構いません。"}
      - {sp: 答, text: "書いてみると、すぐに埋まる欄と、手が止まる欄が分かります。手が止まった欄は、急いで埋めなくて構いません。"}
      - {sp: 聞, text: "4行の書き方と、手が止まったときの考え方は、概要欄のnoteの記事にまとめてあります。", pause: 1.0}
