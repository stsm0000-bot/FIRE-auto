# 長尺 ― 新テーマ「数十万円の戸建てをコツコツ買って、家賃収入を積み上げる」
# 語り手: 答＝大家本人（私）。数字は特定を避けるため丸めた実数。場所は区までにとどめる。
# ★印の数字・事実は、公開前に本人が実態に合わせて直すこと（docs/07 の確認表を使う）
id: "002"
kind: long
title: "50万円の戸建てから、家賃収入を年1,000万円まで積み上げる道筋｜小さい物件のリアル"
question: "数十万円の戸建てで、本当に家賃収入は積み上がるのか？"
note_url: "https://note.com/dokechi_hudousan"
disclaimer: "物件・数字は特定を避けるため丸めています。個別のご相談・物件のご紹介は承っておりません"
thumbnail:
  big: "50万円の\n戸建て"
  sub: "家賃7万円で貸すと"
publish:
  lead: "数十万円〜数百万円の戸建てを1戸ずつ買い、家賃収入を積み上げてきた道筋を、丸めた実数で話します。費用と失敗も。"
  tags: [不動産投資, 大家, ボロ戸建て, 戸建て投資, 小規模大家, 家賃収入, 利回り]
speakers:
  聞: {voicevox_id: 14, name: "聞き手", color: "#2F5FB3"}
  答: {voicevox_id: 52, name: "大家", color: "#A3631C"}

scenes:
  # ---- フック: 数字が主役
  - id: hook
    layout: counter
    heading: "買値"
    value: 50
    unit: "万円"
    sub: "築50年の戸建て。家賃は月7万円 ★"
    dur: 1.6
    lines:
      - {sp: 答, text: "買値50万円の戸建てがあります。直して貸すと、家賃は月7万円。"}
      - {sp: 聞, text: "50万円で、家ですか。"}
      - {sp: 答, text: "はい。私は、こういう数十万円から数百万円の戸建てを、1戸ずつ買ってきました。"}

  - id: hook2
    layout: counter
    heading: "積み上げると、家賃収入は"
    value: 1000
    unit: "万円／年"
    sub: "12戸 × 月7万円 の計算。今日はここまでの道筋と、費用と失敗の話"
    dur: 2.2
    lines:
      - {sp: 答, text: "積み上げると、家賃収入は年1,000万円が見えてきます。12戸、月7万円ずつの計算です。"}
      - {sp: 答, text: "今日は、そこまでの道筋を、丸めた実数で話します。うまくいかなかったことも入れます。"}

  - id: intro
    layout: title
    heading: "不動産の仕入れと販売の仕事をしながら\n自分でも小さい物件を買っている大家です"
    sub: "物件と数字は、特定を避けるため丸めています"
    lines:
      - {sp: 答, text: "私は、不動産の仕入れと販売の仕事をしながら、自分でも小さい物件を買っている大家です。"}
      - {sp: 聞, text: "物件や数字は、特定を避けるために丸めてあります。場所も区までにとどめます。"}

  # ---- 第1章
  - id: c1
    layout: chapter
    heading: "50万円の戸建ては、本当にあるのか"
    lines:
      - {sp: 聞, text: "まず、そんな物件が本当にあるんですか。"}

  - id: c1_list
    layout: list
    heading: "安い戸建てが出てくる場所"
    items:
      - {text: "東京都内の区部にもある", note: "板橋区・足立区など ★"}
      - {text: "築50年前後・再建築不可・相続で持て余した家", note: "買い手がつきにくい"}
      - {text: "借りたい人はいる", note: "月7万円で戸建てに住みたい人"}
    lines:
      - {sp: 答, text: "あります。東京都内の区部でも、郊外に行けばもっと出ます。", step: 1}
      - {sp: 答, text: "共通しているのは、築50年前後で、再建築ができない土地だったり、相続で持て余した家だったりすること。", step: 2}
      - {sp: 答, text: "買い手がつきにくいので、値段が下がる。売る側は、早く手放したい。"}
      - {sp: 聞, text: "でも、そんな家を借りる人がいますか。"}
      - {sp: 答, text: "います。月7万円で、庭つきの戸建てに住みたい人は、思っているより多い。ここが戸建ての強みです。", step: 3, mark: 3}

  - id: c1_photo
    layout: photo
    before: {placeholder: "買ったときの写真\n（特定できない範囲で）", caption: "買値50万円・築50年 ★", tag: "買ったとき"}
    after:  {placeholder: "直したあとの写真", caption: "直し150万円・家賃7万円 ★", tag: "直したあと"}
    lines:
      - {sp: 答, text: "買ったときは、こんな状態でした。床が傾いていて、水回りはそのままでは使えない。", step: 1}
      - {sp: 答, text: "直したあとがこちら。150万円かけました。これで月7万円で借り手がつきます。", step: 2}

  # ---- 第2章
  - id: c2
    layout: chapter
    heading: "1戸の数字と、積み上げ方"
    lines:
      - {sp: 答, text: "では、1戸の数字を順に出します。買値、直し、家賃の順です。"}

  - id: c2_cost
    layout: flow
    heading: "1戸にかかったお金"
    items:
      - {text: "買値", value: "50万円"}
      - {text: "直し", value: "150万円", op: "＋"}
      - {text: "合計", value: "200万円", op: "＝", sum: true}
    lines:
      - {sp: 答, text: "買値が50万円。", step: 1}
      - {sp: 答, text: "直しに150万円。ここが本体です。安い家は、買値より直しのほうが高い。", step: 2}
      - {sp: 答, text: "合わせて200万円。これが1戸にかかったお金です。", step: 3}

  - id: c2_rent
    layout: flow
    heading: "1年の家賃と、手残り"
    items:
      - {text: "家賃 月7万円×12", value: "84万円"}
      - {text: "固定資産税", value: "3万円", op: "−"}
      - {text: "修繕の積み立て", value: "10万円", op: "−"}
      - {text: "空室1か月ぶん", value: "7万円", op: "−"}
      - {text: "手残り", value: "64万円", op: "＝", sum: true}
    lines:
      - {sp: 答, text: "家賃は月7万円。1年で84万円。200万円に対して、表面の利回りは約42パーセントです。", step: 1}
      - {sp: 聞, text: "ずいぶん高いですね。"}
      - {sp: 答, text: "ここから引くものがあります。固定資産税が年3万円ほど。", step: 2}
      - {sp: 答, text: "修繕の積み立てに年10万円。古い家は、必ずどこかが壊れます。", step: 3}
      - {sp: 答, text: "空室も見ておきます。1年に1か月ぶん、7万円。", step: 4}
      - {sp: 答, text: "手残りは年64万円。3年ちょっとで、かけたお金が戻る計算です。", step: 5, mark: 5}

  - id: c2_stack
    layout: portfolio
    count: 12
    rent: 7
    label: "戸建て"
    lines:
      - {sp: 答, text: "これを、1戸ずつ増やします。", step: 1}
      - {sp: 答, text: "手残りを貯めて、次の1戸に回す。3戸になると、月の家賃は21万円。", step: 3}
      - {sp: 答, text: "6戸で月42万円。ここまで来ると、会社の給料と並ぶ人も多いはずです。", step: 6}
      - {sp: 答, text: "12戸で月84万円。年にすると1,000万円を超えます。", step: 12}
      - {sp: 聞, text: "何年くらいかかるものですか。"}

  - id: c2_time
    layout: timeline
    heading: "積み上げの年表（私の場合を丸めたもの ★）"
    items:
      - {when: "1年目", text: "1戸目", note: "貯金200万円から"}
      - {when: "3年目", text: "3戸", note: "手残りを次に回す"}
      - {when: "5年目", text: "6戸", note: "月の家賃42万円"}
      - {when: "8年目", text: "12戸", note: "年1,000万円"}
    lines:
      - {sp: 答, text: "私の場合を丸めると、1年目に1戸。貯金200万円からでした。", step: 1}
      - {sp: 答, text: "3年目に3戸。手残りを次の1戸に回していくと、このくらいの速さです。", step: 2}
      - {sp: 答, text: "5年目に6戸、8年目に12戸。融資を大きく組まなくても、ここまでは来られます。", step: 4}
      - {sp: 聞, text: "簡単、ではないですね。"}
      - {sp: 答, text: "簡単ではありません。ただ、大金がないと始められない、というのは違います。"}

  # ---- 第3章（失敗）
  - id: c3
    layout: chapter
    heading: "うまくいかなかったこと"
    lines:
      - {sp: 答, text: "うまくいった話だけでは、半分です。うまくいかなかったことを2つ。"}

  - id: c3_compare
    layout: compare
    left:  {title: "見積りが膨らんだ", tone: bad,  items: ["直し150万円の予定が230万円に ★", "屋根裏の雨漏りが、買ったあとに判明", "買う前に屋根裏を見ていなかった"]}
    right: {title: "4か月、借り手がつかなかった", tone: bad, items: ["家賃7万5千円で出して反応なし ★", "7万円に下げてすぐ決まった", "5千円の差で4か月＝30万円の損"]}
    lines:
      - {sp: 答, text: "1つ目。直しの見積りが膨らんだこと。150万円の予定が230万円になりました。", step: 1}
      - {sp: 答, text: "屋根裏の雨漏りが、買ったあとに分かった。買う前に屋根裏を見ていなかったのが原因です。"}
      - {sp: 答, text: "2つ目。4か月、借り手がつかなかったこと。家賃を5千円欲張ったのが原因でした。", step: 2}
      - {sp: 答, text: "7万円に下げたらすぐ決まった。5千円の差で4か月、30万円の損です。"}
      - {sp: 聞, text: "どちらも、買う前と貸す前の確認で防げたこと、ですね。"}

  # ---- まとめと今日の一歩
  - id: wrap
    layout: flow
    heading: "今日の話"
    items: ["安い戸建てはある", "買値・直し・家賃を順に見る", "失敗は確認不足から"]
    lines:
      - {sp: 答, text: "安い戸建てはある。数字は、買値、直し、家賃の順に見る。失敗は、確認不足から起きる。", step: 3}

  - id: ending
    layout: ending
    heading: "ポータルサイトで\n「50万〜300万円・戸建て」で1日眺める"
    sub: "買わなくていい。どんな家が、いくらで出ているかを知るだけ"
    cta: "数字の見方は note に ▶"
    lines:
      - {sp: 答, text: "今日の一歩。ポータルサイトで、50万円から300万円、戸建て、の条件で1日眺めてみてください。"}
      - {sp: 答, text: "買わなくていい。どんな家が、いくらで出ているかを知るだけで、見え方が変わります。"}
      - {sp: 聞, text: "買値・直し・家賃の数字の見方は、概要欄のnoteの記事にまとめてあります。", pause: 1.0}
