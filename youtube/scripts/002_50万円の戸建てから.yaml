    left:  {title: "ぽん太の皮算用", tone: bad,  items: ["総額 220万円", "表面 38％", "3.4年で戻る"]}
    right: {title: "現実", tone: good, items: ["総額 300万円", "手残り 64万円（21％）", "4.7年で戻る"]}
    lines:
      - {sp: 答, text: "ぽん太くんの皮算用と、現実を並べます。", step: 1, st: "ノーマル"}
      - {sp: 聞, text: "表面38パーセント、3年ちょっとで戻る……はずだった。", step: 1, st: "ノーマル", face: doubt}
      - {sp: 答, text: "現実は、総額300万円、手残り64万円。5年弱で戻る計算。", step: 2, st: "ノーマル"}
      - {sp: 聞, text: "それでも、銀行の定期よりは、ずっといいですよね？", st: "あまあま", face: happy}
      - {sp: 答, text: "そこは、はい。ただし、手間と、見落としの代償はこのとおり。", st: "熱血", face: fire}

  # ---- 山④: 12戸の未来図
  - id: sky
    layout: scene
    bg: sky
    camera: out
    chars:
