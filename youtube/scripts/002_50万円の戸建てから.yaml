      - {sp: 聞, text: "5千円の欲、でしたっけ。", step: 1, st: "ノーマル"}
      - {sp: 答, text: "家賃を、7万5千円で募集に出した。相場は7万円。", step: 2, st: "しっとり", face: calm}
      - {sp: 答, text: "直しに230万円もかけたから、少し上でもいける。そう思った。", step: 2, st: "しっとり", face: calm}
      - {sp: 答, text: "1か月、問い合わせなし。2か月、内見ゼロ。", step: 3, st: "かなしみ", face: calm}
      - {sp: 答, text: "3か月……4か月。", step: 4, st: "かなしみ", face: calm, pause: 0.6}
      - {sp: 聞, text: "たった5千円の差で？ ランチ5回分ですよ？", step: 5, st: "ツンツン", face: surprised}

  - id: c3_vacancy
    layout: compare
    left:  {title: "7万5千円で募集", tone: bad,  items: ["4か月、反応なし", "空室4か月 ＝ 30万円の損"]}
    right: {title: "7万円に下げた", tone: good, items: ["翌週に決まった", "差は月5千円＝年6万円"]}
    lines:
