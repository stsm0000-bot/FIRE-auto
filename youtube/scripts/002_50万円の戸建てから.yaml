      - {sp: 答, text: "長い。ただ、大金と融資がないと始められない、は違います。", mark: 1, st: "熱血", face: fire}
      - {sp: 聞, text: "12戸も、会社員が管理できるんですか？", st: "ツンツン", face: doubt}
      - {sp: 答, text: "管理は管理会社に任せる。私がやるのは、月に1回、通帳を見ること。", mark: 4, st: "ノーマル", face: calm}

