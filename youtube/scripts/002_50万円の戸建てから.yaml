# 長尺 ― 実例シリーズ「50万円の戸建てから、家賃収入を積み上げる」物語版 v4（収益化に特化）
# 語り手: 答＝コツさん（大家本人・私）。聞＝ぽん太（皮算用が得意な会社員・視聴者役）。
#
# ■ v4 の狙い
#   - 0〜3秒で結果の数字（家賃7万円・買値50万円）を画面と台詞に出し、4秒でサムネの数字（直したら300万円）。挨拶・自己紹介から始めない。
#   - 3〜10秒で「見終わるとこうなる」＋オープンループ（最後に1戸目で損した金額を言う。ヒントは5千円の欲）。
#   - 10〜30秒で物語の入口（ぽん太の残業帰りの夜 → 週末の散歩でコツさんに出会う）。自己紹介は 52 秒ごろに 2 台詞（第 1 章の扉は 1:04）。
#   - 全 35 場面のうち 18 場面が scene（キャラが場所に立つ物語）、残りは数字の図解。交互に置く。
#   - 山は 4 つ: ①50万円の家を見つける（驚き） ②見積りが 80 万円膨らむ（失敗1） ③通帳に 7 万円（達成）
#     ④12 戸の未来図 →「でも 1 戸目は…」（5 千円欲張って 4 か月空室＝オープンループの回収、失敗2）
#   - note への送客 2 か所（bar 場面「見積りの内訳の一覧表」／ ending「確認 12 項目のチェック表と見積りの内訳表」）
#   - コメントを促す問い 1 つ（street2「地元で 100 万円以下の家、見たことありますか？」）
#   - ending は 20 秒以上（次回「50万円の家の探し方」の予告つき。終了画面の要素を置く時間）
#   - 1 台詞 1 変化: scene は props の step、図解は step/mark を台詞ごとに進める。
#   - 品質部の「次の 1 本で直す 5 つ」(docs/11) を反映: 写真 2 枚（photo 小道具）、冒頭 20 秒の作り直し、1 台詞 1 変化、
#     キャラ名で名乗る、数字を閉じる（諸費用 20 万を足して総額 300 万／年表に手残り以外の原資）。
#
# ■ 推定尺（台詞の文字数 × 0.155 秒 ＋ 台詞ごとの間 0.3 秒（pause 指定はその値）＋ 場面ごとの間 0.6 秒（章扉 0.8））
#   台詞 139・文字数 約3,010・場面 35 → 約 8 分 53 秒（公開前にスタブ音声で実測すること）
#
# ■ ★ 公開前に本人が実態に合わせて直す数字・事実（台詞 text には ★ を入れない。ここで管理する）
#   ★1 買値 50 万円・築 50 年・東京都内の区部（板橋区・足立区の例示）
#   ★2 直しの見積り 150 万円 → 実際 230 万円（原因＝屋根裏の雨漏り）。内訳の順（屋根・水回り・床・壁）
#   ★3 諸費用 20 万円（仲介手数料・登記・不動産取得税・火災保険）
#   ★3' 膨らんだ 80 万円は銀行に断られて貯金から出した（1 戸目は現金 300 万円）
#   ★4 家賃 7 万円。相場 7 万円のところを 7 万 5 千円で募集 → 4 か月空室 → 7 万円に下げて翌週に決まった
#   ★5 固定資産税 年 3 万円・修繕の積み立て 年 10 万円・空室 1 か月ぶん 7 万円 → 手残り 64 万円
#   ★6 工事 4 か月・空室 4 か月・買ってから鍵を渡すまで 8 か月
#   ★7 年表: 貯金 300 万円から 1 戸目、給料から年 100 万円の貯金を足して 3 年目 3 戸・5 年目 6 戸・8 年目 12 戸
#   ★8 管理は管理会社に任せ、本人がやるのは月 1 回通帳を見ること
#   ★9 note の具体物: 「買う前の確認 12 項目のチェック表」「見積りの内訳表」を note 側に実際に置く
#   ★10 写真 2 枚: scripts/photos/room_before.jpg（床・水回り）, scripts/photos/room_after.jpg（同じ場所）。外観・表札・窓の外は写さない
#
id: "002"
kind: long
title: "50万円の家を買い、家賃7万円が入るまで｜失敗2つ込み"
question: "50万円の家を買って、家賃が入るまでに何が起きたか"
note_url: "https://note.com/dokechi_hudousan"
disclaimer: "物件・数字は特定を避けるため丸めています。個別のご相談・物件のご紹介は承っておりません"
thumbnail:
  big: "直したら\n300万円"
  sub: "50万円の家"
publish:
  lead: "買値50万円・築50年の戸建てを買って、家賃7万円が通帳に入るまでの全部の数字。直しの見積りが80万円膨らんだ話、5千円欲張って4か月空室にした話、12戸まで積み上げた年表を、丸めた実数で。"
  tags: [不動産投資, 大家, ボロ戸建て, 戸建て投資, 小規模大家, 家賃収入, 築古戸建て, 利回り, 会社員]
speakers:
  聞: {speaker: "ずんだもん", style: "ノーマル", name: "ぽん太", color: "#2F80ED", char: "ぽん太"}
  答: {speaker: "青山龍星", style: "ノーマル", name: "コツさん", color: "#FF7A1A", char: "コツさん"}
voice: {speed: 1.1, intonation: 1.3}

scenes:
  # ================================================================
  # フック（0:00〜0:07）: 結果の数字を 0〜3 秒で画面と台詞に。挨拶なし
  # ================================================================
  - id: hook
    layout: scene
    bg: house_old
    time: day
    camera: in
    chars:
      - {who: コツさん, at: center, act: point, face: normal}
    props:
      - {kind: headline, text: "家賃7万円の家、買値50万円", step: 1}
      - {kind: price, text: "50万円", at: right, step: 1}
      - {kind: price, text: "直したら 300万円", at: left, step: 2}
      - {kind: bubble, text: "丸めた数字", who: コツさん, step: 3}
    steps: 3
    lines:
      - {sp: 答, text: "家賃、月7万円。買値、50万円。", step: 1, st: "喜び", face: happy}
      - {sp: 答, text: "直したら、300万円。", step: 2, st: "ノーマル", face: calm, pause: 0.4}
      - {sp: 答, text: "私が持っている家の、丸めた数字です。", step: 3, st: "ノーマル"}

  # ---- 3〜10 秒: 見終わるとこうなる ＋ オープンループ
  - id: hook2
    layout: scene
    bg: sky
    camera: pan_right
    chars:
      - {who: コツさん, at: center, act: stand, face: normal}
    props:
      - {kind: headline, text: "見終わると：買値・直し・家賃で家を見る目", step: 1}
      - {kind: sign, text: "最後に：1戸目で損した金額", at: right, step: 2}
      - {kind: question, who: コツさん, step: 2}
    steps: 2
    lines:
      - {sp: 答, text: "見終わると、買値、直し、家賃で、家を見る目がつきます。", step: 1, st: "ノーマル"}
      - {sp: 答, text: "最後に、1戸目で損した金額も。ヒントは、5千円の欲。", step: 2, st: "囁き", face: calm, pause: 0.5}

  # ================================================================
  # 物語の入口（0:17〜）: ぽん太の夜 → 週末の散歩 → コツさんに出会う
  # ================================================================
  - id: night
    layout: scene
    bg: night
    time: night
    camera: pan_left
    chars:
      - {who: ぽん太, at: center, act: walk, face: calm}
    props:
      - {kind: headline, text: "ある平日、23時", step: 1}
      - {kind: price, text: "家賃 8万円", at: right, step: 2}
      - {kind: question, who: ぽん太, step: 3}
    steps: 3
    lines:
      - {sp: 聞, text: "はあ……今日も終電。", step: 1, st: "ささやき", face: calm, speed: 0.95}
      - {sp: 聞, text: "家賃8万円を払って、平日は会社、休みは寝るだけ。", step: 2, st: "ノーマル", face: calm}
      - {sp: 聞, text: "このままで、いいのかな。", step: 3, st: "ノーマル", face: doubt, pause: 0.6}

  - id: street
    layout: scene
    bg: street
    time: day
    weather: sun
    camera: pan_right
    chars:
      - {who: ぽん太, at: offleft, act: walk, face: normal}
      - {who: コツさん, at: right, act: think, face: calm}
    props:
      - {kind: headline, text: "週末の昼、散歩の途中", step: 1}
      - {kind: question, who: ぽん太, step: 2}
    steps: 2
    lines:
      - {sp: 聞, text: "週末、散歩に出たら……あれ、あの人。", step: 1, st: "ノーマル"}
      - {sp: 聞, text: "ボロい家の前で、ずっと何か見てる。", step: 2, st: "ヒソヒソ", face: doubt}

  # ---- 山①の入口: 50万円の家（驚き）
  - id: house_meet
    layout: scene
    bg: house_old
    time: day
    camera: in
    chars:
      - {who: ぽん太, at: left, act: stand, face: normal}
      - {who: コツさん, at: right, act: point, face: calm}
    props:
      - {kind: sign, text: "売家", at: center, step: 1}
      - {kind: bubble, text: "買おうかと", who: コツさん, step: 2}
      - {kind: sweat, who: ぽん太, step: 3}
      - {kind: price, text: "500万円？", at: left, step: 4}
      - {kind: cross, at: left, step: 5}
      - {kind: price, text: "50万円", at: center, step: 5}
      - {kind: exclaim, who: ぽん太, step: 6}
    steps: 6
    lines:
      - {sp: 聞, text: "あの、この家、どうかしたんですか？", step: 1, st: "ノーマル"}
      - {sp: 答, text: "買おうかと思って。", step: 2, st: "喜び", face: happy}
      - {sp: 聞, text: "買う！？ この、雑草だらけの家を！？", step: 3, st: "あまあま", face: surprised}
      - {sp: 答, text: "値段、いくらだと思います？", step: 3, st: "ノーマル"}
      - {sp: 聞, text: "……500万円、くらい？", step: 4, st: "ノーマル", face: doubt, pause: 0.8}
      - {sp: 答, text: "50万円。", step: 5, st: "喜び", face: happy, pause: 0.6}
      - {sp: 聞, text: "えっ、50万円で家！？ 中古車より安い！", step: 6, st: "あまあま", face: surprised}

  # ---- 自己紹介（30 秒以降・2 台詞・固定文）
  - id: intro
    layout: title
    cast: true
    heading: "不動産の仕入れと販売の仕事をしながら\n自分でも小さい物件を買っている大家です"
    sub: "数字は丸めた実数・場所は区まで"
    lines:
      - {sp: 答, text: "不動産の仕入れと販売の仕事をしながら、自分でも小さい物件を買っている、コツさんです。", st: "ノーマル"}
      - {sp: 聞, text: "会社員のぽん太です。買う前から皮算用するのが得意です。", st: "あまあま", face: happy}

  # ================================================================
  # 第1章: 50万円の家は、なぜ安いのか（山①）
  # ================================================================
  - id: c1
    layout: chapter
    heading: "50万円の家は、なぜ安いのか"
    lines:
      - {sp: 答, text: "まず、なぜ50万円なのか。安い理由から。", st: "ノーマル"}

  - id: house_why
    layout: scene
    bg: house_old
    time: day
    camera: in
    chars:
      - {who: ぽん太, at: left, act: stand, face: doubt}
      - {who: コツさん, at: right, act: point, face: normal}
    props:
      - {kind: sign, text: "築50年", at: left, step: 1}
      - {kind: sign, text: "再建築不可", at: center, step: 2}
      - {kind: sweat, who: ぽん太, step: 3}
      - {kind: sign, text: "相続", at: right, step: 4}
      - {kind: arrow, text: "値段が落ちる", dir: down, at: center, step: 5}
    steps: 5
    lines:
      - {sp: 答, text: "安い理由は3つ。1つ目、築50年。", step: 1, st: "ノーマル"}
      - {sp: 答, text: "2つ目、再建築ができない土地。", step: 2, st: "ノーマル"}
      - {sp: 聞, text: "再建築不可って、建て替えられないってことですよね？ 売れないんじゃ……", step: 3, st: "ツンツン", face: doubt}
      - {sp: 答, text: "売りにくい。だから安い。3つ目、相続で持て余した家。", step: 4, st: "ノーマル"}
      - {sp: 答, text: "売る側は、早く手放したい。それで値段が落ちる。", step: 5, st: "しっとり", face: calm}

  - id: c1_list
    layout: list
    heading: "安い戸建てが出てくる場所"
    items:
      - {text: "東京都内の区部にもある", note: "板橋区・足立区など"}
      - {text: "郊外なら、もっと出る", note: "駅から遠い・バス便"}
      - {text: "借りたい人はいる", note: "月7万円で庭つきの戸建て"}
    lines:
      - {sp: 答, text: "東京都内の区部でも出ます。板橋区、足立区あたり。", step: 1, mark: 1, st: "喜び"}
      - {sp: 聞, text: "都内でも！？", mark: 1, st: "あまあま", face: surprised}
      - {sp: 答, text: "郊外なら、もっと出る。駅から遠い、バスの便の家。", step: 2, mark: 2, st: "ノーマル"}
      - {sp: 聞, text: "でも、そんな家を借りる人、本当にいますか？", st: "ツンツン", face: doubt}
      - {sp: 答, text: "います。月7万円で庭つきの戸建てに住みたい人は、思うより多い。", step: 3, mark: 3, st: "熱血", face: fire}

  # ---- 内見（写真 1 枚目）→ クイズ
  - id: room_old
    layout: scene
    bg: room_old
    camera: in
    chars:
      - {who: ぽん太, at: left, act: shock, face: surprised}
      - {who: コツさん, at: right, act: point, face: calm}
    props:
      - {kind: photo, image: photos/room_before.jpg, caption: "買ったとき：床と水回り", x: 50, step: 1}
      - {kind: sweat, who: ぽん太, step: 2}
      - {kind: question, who: コツさん, step: 3}
      - {kind: bubble, text: "直しも50万円？", who: ぽん太, step: 4}
      - {kind: stamp, text: "150万円", x: 50, step: 5}
      - {kind: exclaim, who: ぽん太, step: 6}
    steps: 6
    lines:
      - {sp: 答, text: "中はこう。床が傾いて、水回りはそのままでは使えない。", step: 1, st: "しっとり", face: calm}
      - {sp: 聞, text: "うわ……。住めないですよね、これ。", step: 2, st: "ヒソヒソ", face: doubt}
      - {sp: 答, text: "ここでクイズ。貸せる状態にするのに、いくらかかると思います？", step: 3, st: "ノーマル"}
      - {sp: 聞, text: "50万円の家だから……直しも50万円くらい？", step: 4, st: "ノーマル", face: doubt, pause: 0.8}
      - {sp: 答, text: "見積りは150万円。買値の3倍。安い家は、買値より直しのほうが高い。", step: 5, st: "喜び"}
      - {sp: 聞, text: "3倍、ですか……。", step: 6, st: "ノーマル", face: surprised}

  # ---- 買付・契約
  - id: office
    layout: scene
    bg: office
    camera: still
    chars:
      - {who: コツさん, at: left, act: sit, face: normal}
      - {who: ぽん太, at: right, act: stand, face: surprised}
    props:
      - {kind: stamp, text: "契約", at: center, step: 1}
      - {kind: money, text: "50万円", at: center, step: 2}
      - {kind: price, text: "諸費用 20万円", at: right, step: 3}
      - {kind: sweat, who: ぽん太, step: 4}
    steps: 4
    lines:
      - {sp: 答, text: "買付を入れて、契約。", step: 1, st: "喜び", face: happy}
      - {sp: 聞, text: "ほんとに買った……。", step: 2, st: "あまあま", face: surprised}
      - {sp: 答, text: "買値50万円に、仲介手数料や登記、保険で、諸費用が20万円。", step: 3, st: "ノーマル"}
      - {sp: 聞, text: "あ、そこもかかるんだ。", step: 4, st: "ノーマル", face: doubt}

  - id: c1_counter
    layout: counter
    heading: "買値"
    value: 50
    unit: "万円"
    sub: "諸費用20万円は別。次は、直し"
    dur: 1.4
    lines:
      - {sp: 答, text: "数字は、買値、直し、家賃の順に見ます。まず買値、50万円。", st: "ノーマル"}
      - {sp: 答, text: "この順番を飛ばして家賃から見ると、皮算用になります。", st: "ノーマル", face: calm}
      - {sp: 聞, text: "買値50万円に、諸費用20万円。ここまでは、分かりました。", st: "ノーマル", face: normal}

  # ================================================================
  # 第2章: 直して、貸す（山②＝見積りが膨らむ）
  # ================================================================
  - id: c2
    layout: chapter
    heading: "直して、貸す"
    lines:
      - {sp: 答, text: "直して、貸す。ここからが本体です。", st: "ノーマル"}

  # ---- ぽん太の皮算用（夜の机）
  - id: desk
    layout: scene
    bg: desk
    time: night
    camera: in
    chars:
      - {who: ぽん太, at: left, act: sit, face: happy}
      - {who: コツさん, at: right, act: stand, face: calm}
    props:
      - {kind: counter, value: 220, unit: "万円", label: "皮算用の総額", at: center, step: 1}
      - {kind: bubble, text: "38％！", who: ぽん太, step: 2}
      - {kind: star, who: ぽん太, step: 3}
      - {kind: sweat, who: コツさん, step: 4}
      - {kind: exclaim, who: コツさん, step: 5}
    steps: 5
    lines:
      - {sp: 聞, text: "計算しました。50足す150足す20で、総額220万円。", step: 1, st: "あまあま", face: happy}
      - {sp: 聞, text: "家賃7万円で貸せば、年84万円。", step: 2, st: "あまあま", face: happy}
      - {sp: 聞, text: "84割る220で、表面の利回り38パーセント！", step: 2, st: "あまあま", face: happy}
      - {sp: 聞, text: "3年ちょっとで、元が取れる計算です。", step: 3, st: "あまあま", face: happy}
      - {sp: 答, text: "表面は、ですね。経費を引いた手残りは、あとで出します。", step: 4, st: "ノーマル", face: calm}
      - {sp: 答, text: "その前に、ここで事件が起きます。", step: 5, st: "しっとり", face: calm, pause: 0.5}

  # ---- 工事現場: 雨漏り発覚
  - id: site_a
    layout: scene
    bg: site
    camera: in
    chars:
      - {who: コツさん, at: left, act: stand, face: calm}
      - {who: ぽん太, at: right, act: stand, face: normal}
    props:
      - {kind: headline, text: "工事、1週間目", step: 1}
      - {kind: question, who: コツさん, step: 2}
      - {kind: sweat, who: ぽん太, step: 3}
      - {kind: sign, text: "屋根裏に雨漏り", at: center, step: 4}
    steps: 4
    lines:
      - {sp: 答, text: "工事が始まって、職人が屋根裏をのぞいた。", step: 1, st: "ノーマル"}
      - {sp: 答, text: "降りてきた職人が、言いにくそうに、ちょっと、と。", step: 2, st: "しっとり", face: calm}
      - {sp: 聞, text: "……嫌な予感。", step: 3, st: "ヒソヒソ", face: doubt}
      - {sp: 答, text: "雨漏り。天井の裏が、腐っていた。", step: 4, st: "かなしみ", face: calm}

  - id: site_b
    layout: scene
    bg: site
    camera: shake
    chars:
      - {who: コツさん, at: center, act: shock, face: surprised}
    props:
      - {kind: price, text: "150万円", at: left, step: 1}
      - {kind: cross, at: left, step: 2}
      - {kind: price, text: "230万円", at: right, step: 2}
      - {kind: arrow, text: "＋80万円", dir: up, at: center, step: 3}
    steps: 3
    lines:
      - {sp: 答, text: "見積りは、150万円のはずだった。", step: 1, st: "しっとり", face: calm}
      - {sp: 答, text: "230万円。", step: 2, st: "かなしみ", face: calm, pause: 0.6}
      - {sp: 聞, text: "80万円！？ 1戸の手残り、1年分より多いじゃないですか！", step: 3, st: "あまあま", face: surprised}

  - id: c2_bar
    layout: bar
    heading: "直しの見積り"
    rows:
      - {label: "予定", value: 150, note: "150万円"}
      - {label: "実際", value: 230, note: "230万円（屋根裏の雨漏り）"}
    lines:
      - {sp: 答, text: "予定、150万円。", step: 1, mark: 1, st: "ノーマル"}
      - {sp: 答, text: "実際、230万円。原因は、買う前に屋根裏を見なかったこと。それだけ。", step: 2, mark: 2, st: "しっとり", face: calm}
      - {sp: 聞, text: "それだけで、80万円……。", st: "ノーマル", face: doubt}
      - {sp: 答, text: "内訳で大きいのは、屋根、水回り、床、壁の順。古い家は、たいていこの順です。", mark: 2, st: "ノーマル"}
      - {sp: 答, text: "見積りの内訳の一覧表は、noteに置いてあります。概要欄から見られます。", st: "ノーマル"}

