# 長尺 ― 実例シリーズ「50万円の戸建てから、家賃収入を積み上げる」（唸らせる版）
# 語り手: 答＝コツさん（大家本人・私）。聞＝ぽん太（皮算用が得意な会社員・視聴者役）。
# 数字は特定を避けるため丸めた実数。場所は区まで。
# ★印の数字・事実は、公開前に本人が実態に合わせて直す（画面と字幕には ★ は出ない。台詞 text には ★ を入れない）
id: "002"
kind: long
title: "買値50万円・家賃7万円｜戸建てを12戸まで積み上げた道筋"
question: "数十万円の戸建てで、本当に家賃収入は積み上がるのか？"
note_url: "https://note.com/dokechi_hudousan"
disclaimer: "物件・数字は特定を避けるため丸めています。個別のご相談・物件のご紹介は承っておりません"
thumbnail:
  big: "50万円の\n戸建て"
  sub: "家賃7万円で貸すと"
publish:
  lead: "買値50万円・直し150万円・家賃7万円。数十万円の戸建てを1戸ずつ買い、12戸まで積み上げた道筋を丸めた実数で。見積りが80万円膨らんだ話と、5千円欲張って4か月空室にした話も。"
  tags: [不動産投資, 大家, ボロ戸建て, 戸建て投資, 小規模大家, 家賃収入, 利回り]
speakers:
  聞: {speaker: "ずんだもん", style: "ノーマル", name: "ぽん太", color: "#2F80ED"}
  答: {speaker: "青山龍星", style: "ノーマル", name: "コツさん", color: "#FF7A1A"}
voice: {speed: 1.1, intonation: 1.3}

scenes:
  # ---- フック（0:00〜）: 5秒で数字と結論、10秒以内に「見終わると何が分かるか」
  - id: hook
    layout: counter
    heading: "買値"
    value: 50
    unit: "万円"
    sub: "築50年の戸建て。家賃は月7万円 ★"
    dur: 1.4
    lines:
      - {sp: 答, text: "買値50万円、家賃は月7万円。これ、私が持っている家の数字です。", st: "喜び"}
      - {sp: 聞, text: "50万円で、家！？ 中古車より安いじゃないですか！", st: "あまあま", face: surprised}
      - {sp: 答, text: "見終わる頃には、買値・直し・家賃の3つの数字で、戸建てを見る目がつきます。", st: "ノーマル"}
      - {sp: 聞, text: "数字は特定を避けるために丸めてあって、場所も区までです。", st: "ノーマル"}

  # ---- 数字のドン（0:20〜）: 1,000万円 → すぐに「費用と失敗」で釘を刺す
  - id: hook2
    layout: counter
    tone: money
    burst: true
    heading: "12戸に増やすと、家賃収入は"
    value: 1000
    unit: "万円／年"
    sub: "12戸 × 月7万円 × 12か月の計算。費用と失敗も、このあと全部"
    dur: 2.2
    lines:
      - {sp: 答, text: "これを12戸に増やすと、家賃収入は年1,000万円が見えてきます。", st: "熱血", face: fire}
      - {sp: 聞, text: "1,000万円！ 12戸かける7万円かける12か月……ほんとだ！", st: "あまあま", face: happy}
      - {sp: 答, text: "ただし今日は、費用と失敗も全部出します。そこを見ないと、皮算用ですから。", st: "ノーマル", face: calm}

  # ---- 自己紹介（固定文）
  - id: intro
    layout: title
    heading: "不動産の仕入れと販売の仕事をしながら\n自分でも小さい物件を買っている大家です"
    sub: "数字は丸めた実数・場所は区まで"
    lines:
      - {sp: 答, text: "私は、不動産の仕入れと販売の仕事をしながら、", st: "ノーマル"}
      - {sp: 答, text: "自分でも小さい物件を買っている大家です。", st: "ノーマル"}
      - {sp: 聞, text: "ぽん太です。買う前から儲かった気になるのが得意です。", st: "あまあま", face: happy}

  # ---- 第1章: 本当にあるのか（反論 → 都内でも → 借り手はいるのか → 写真 → クイズ）
  - id: c1
    layout: chapter
    heading: "50万円の戸建ては、本当にあるのか"
    lines:
      - {sp: 聞, text: "まず聞きたいです。50万円の家なんて、本当にあるんですか？", st: "ツンツン", face: doubt}

  - id: c1_list
    layout: list
    heading: "安い戸建てが出てくる場所"
    items:
      - {text: "東京都内の区部にもある", note: "板橋区・足立区など ★"}
      - {text: "築50年前後・再建築不可・相続の家", note: "買い手がつきにくい"}
      - {text: "借りたい人はいる", note: "月7万円で庭つき戸建てに住みたい人"}
    lines:
      - {sp: 答, text: "あります。東京都内の区部でも出ますし、郊外ならもっと出ます。", step: 1, st: "喜び"}
      - {sp: 聞, text: "都内でも！？ じゃあ、なんでそんなに安いんですか？", st: "ノーマル", face: surprised}
      - {sp: 答, text: "共通点は3つ。築50年前後、再建築ができない土地、相続で持て余した家。", step: 2, st: "ノーマル"}
      - {sp: 答, text: "買い手がつきにくいから、値段が落ちる。売る側は、早く手放したい。", st: "ノーマル"}
      - {sp: 聞, text: "でも、そんな家を借りる人、本当にいますか？", st: "ツンツン", face: doubt}
      - {sp: 答, text: "います。月7万円で庭つきの戸建てに住みたい人は、思うより多いんです。", step: 3, mark: 3, st: "熱血", face: fire}

  - id: c1_photo
    layout: photo
    before: {placeholder: "買ったときの写真\n（特定できない範囲で）", caption: "買値50万円・築50年 ★", tag: "買ったとき"}
    after:  {placeholder: "直したあとの写真", caption: "直したあと・家賃7万円 ★", tag: "直したあと"}
    lines:
      - {sp: 答, text: "買ったときの写真です。床が傾いて、水回りはそのままでは使えない。", step: 1, st: "しっとり"}
      - {sp: 聞, text: "うわ……。これ、住めないですよね。", st: "ヘロヘロ", face: doubt}
      - {sp: 答, text: "ここでクイズ。この家を貸せる状態にするのに、いくらかかったと思います？", st: "ノーマル"}
      - {sp: 聞, text: "えっと……50万円の家だから、直しも50万円くらい？", st: "ノーマル", face: doubt, pause: 0.9}
      - {sp: 答, text: "150万円。買値の3倍です。安い家は、買値より直しのほうが高い。", step: 2, st: "喜び"}

  # ---- 第2章: 1戸の数字と積み上げ（数式を1段ずつ → ぽん太の皮算用 → 経費で現実へ → 12戸 → 年表）
  - id: c2
    layout: chapter
    heading: "1戸の数字と、積み上げ方"
    lines:
      - {sp: 答, text: "では、1戸の数字を出します。順番はいつも、買値、直し、家賃、です。", st: "ノーマル"}

  - id: c2_cost
    layout: flow
    heading: "1戸にかかったお金"
    items:
      - {text: "買値", value: "50万円"}
      - {text: "直し", value: "150万円", op: "＋"}
      - {text: "合計", value: "200万円", op: "＝", sum: true}
    lines:
      - {sp: 答, text: "買値が、50万円。", step: 1, st: "ノーマル"}
      - {sp: 答, text: "直しが、150万円。ここが本体です。", step: 2, st: "ノーマル"}
      - {sp: 聞, text: "足して200万円ですね。もう計算してあります。", step: 3, st: "あまあま", face: happy}

  - id: c2_rent
    layout: flow
    heading: "1年の家賃と、手残り"
    items:
      - {text: "家賃 月7万円×12", value: "84万円"}
      - {text: "固定資産税", value: "3万円", op: "−"}
      - {text: "修繕の積み立て", value: "10万円", op: "−"}
      - {text: "空室1か月ぶん", value: "7万円", op: "−"}
      - {text: "手残り", value: "64万円", op: "＝", sum: true}
    lines:
      - {sp: 答, text: "家賃は月7万円。1年で84万円です。", step: 1, st: "ノーマル"}
      - {sp: 聞, text: "84割る200で……表面利回り42パーセント！ 銀行の何百倍ですか！", st: "あまあま", face: happy}
      - {sp: 答, text: "表面は、ですね。ここから引きます。まず固定資産税が、年3万円。", step: 2, st: "ノーマル", face: calm}
      - {sp: 答, text: "修繕の積み立てに、年10万円。古い家は、どこかが壊れるものです。", step: 3, st: "ノーマル"}
      - {sp: 答, text: "空室も見ておきます。1年に1か月ぶん、7万円。", step: 4, st: "ノーマル"}
      - {sp: 答, text: "手残りは、年64万円。3年ちょっとで、かけたお金が戻る計算です。", step: 5, mark: 5, st: "喜び"}
      - {sp: 聞, text: "42パーセントが、32パーセントに……。でも、まだ十分すごいです。", st: "ツンツン", face: normal}

  - id: c2_stack
    layout: portfolio
    count: 12
    rent: 7
    label: "戸建て"
    lines:
      - {sp: 答, text: "これを、1戸ずつ増やしていきます。", step: 1, st: "ノーマル"}
      - {sp: 答, text: "手残りを貯めて、次の1戸に回す。3戸で、月の家賃は21万円。", step: 3, st: "ノーマル"}
      - {sp: 聞, text: "6戸で42万円！ 給料と並ぶ！ 会社、辞められるんじゃ……", step: 6, st: "あまあま", face: happy}
      - {sp: 答, text: "辞めません。12戸で月84万円、年にすると1,000万円超え。ただし計算です。", step: 12, st: "熱血", face: fire}
      - {sp: 聞, text: "計算、って念を押しますね……。で、何年かかるんですか？", st: "ツンツン", face: doubt}

  - id: c2_time
    layout: timeline
    heading: "積み上げの年表（私の場合を丸めたもの ★）"
    items:
      - {when: "1年目", text: "1戸目", note: "貯金200万円から"}
      - {when: "3年目", text: "3戸", note: "手残りを次に回す"}
      - {when: "5年目", text: "6戸", note: "月の家賃42万円"}
      - {when: "8年目", text: "12戸", note: "年1,000万円"}
    lines:
      - {sp: 答, text: "私の場合を丸めると、1年目に1戸。貯金200万円からでした。", step: 1, st: "ノーマル"}
      - {sp: 答, text: "3年目に3戸。手残りを次の1戸に回すと、このくらいの速さです。", step: 2, st: "ノーマル"}
      - {sp: 聞, text: "3年で3戸なら……6年で6戸、12年で12戸ですね！", st: "あまあま", face: happy}
      - {sp: 答, text: "少し違います。5年目に6戸、8年目に12戸。戸数が増えると、手残りも増える。", step: 4, st: "喜び"}
      - {sp: 聞, text: "8年……。思ったより、長いです。", st: "ヘロヘロ", face: doubt}
      - {sp: 答, text: "長いです。ただ、大金と融資がないと始められない、というのは違います。", st: "熱血", face: fire}

  # ---- 第3章: うまくいかなかったこと（失敗2つ。クイズ → 数字のドン → 防げた確認）
  - id: c3
    layout: chapter
    heading: "うまくいかなかったこと"
    lines:
      - {sp: 答, text: "ここまでが、うまくいった話。ここからが、本当は見てほしい話です。", st: "しっとり", face: calm}
      - {sp: 答, text: "1つ目。直しの見積りです。150万円の予定が、いくらになったと思います？", st: "ノーマル"}
      - {sp: 聞, text: "ええと……170万円くらい、ですか？", st: "ノーマル", face: doubt, pause: 0.9}

  - id: c3_bar
    layout: bar
    heading: "直しの見積り ★"
    rows:
      - {label: "予定", value: 150, note: "150万円"}
      - {label: "実際", value: 230, note: "230万円"}
    lines:
      - {sp: 答, text: "230万円。80万円、膨らみました。", step: 2, st: "かなしみ", face: calm}
      - {sp: 聞, text: "80万円！ 1戸の手残り、1年分より多いじゃないですか！", st: "なみだめ", face: surprised}
      - {sp: 答, text: "原因は、屋根裏の雨漏り。買ったあとに分かった。", mark: 2, st: "しっとり"}
      - {sp: 答, text: "買う前に、屋根裏を見ていなかった。たった、それだけです。", st: "しっとり", face: calm}

  - id: c3_compare
    layout: compare
    left:  {title: "7万5千円で募集 ★", tone: bad,  items: ["4か月、反応なし", "空室4か月 ＝ 約30万円の損"]}
    right: {title: "7万円に下げた", tone: good, items: ["すぐ決まった", "差は、月5千円だけ"]}
    lines:
      - {sp: 答, text: "2つ目。家賃を7万5千円で出したら、4か月、誰も来なかった。", step: 1, st: "しっとり"}
      - {sp: 聞, text: "たった5千円の差で？ ランチ5回分ですよ？", st: "ツンツン", face: surprised}
      - {sp: 答, text: "7万円に下げたら、すぐ決まりました。5千円欲張って、4か月で30万円の損。", step: 2, st: "かなしみ"}
      - {sp: 聞, text: "5千円得しようとして、30万円……。皮算用、僕と同じです。", st: "ヘロヘロ", face: doubt}
      - {sp: 答, text: "どちらも、買う前と貸す前の確認で、防げたことでした。", st: "ノーマル", face: calm}

  # ---- 見解（quote）→ まとめ（flow）→ 今日の一歩（ending）
  - id: view
    layout: quote
    heading: "私の見解"
    text: "安い家の値段は、買値ではなく、直しと確認で決まる"
    caption: "50万円の家ではなく、200万円の家として見る"
    lines:
      - {sp: 答, text: "私の見解です。安い家の値段は、買値ではなく、直しと確認で決まる。", step: 1, st: "しっとり"}
      - {sp: 聞, text: "50万円の家、じゃなくて、200万円の家として見る、ですね。", step: 2, st: "ノーマル", face: calm}
      - {sp: 答, text: "そう見ると、買える家と、やめておく家が、分かれてきます。", st: "ノーマル"}

  - id: wrap
    layout: flow
    heading: "今日の話"
    items: ["安い戸建てはある", "買値・直し・家賃の順に見る", "失敗は確認不足から"]
    lines:
      - {sp: 答, text: "安い戸建てはある。数字は買値、直し、家賃の順。失敗は、確認不足から起きる。", step: 3, st: "ノーマル"}

  - id: ending
    layout: ending
    heading: "ポータルサイトで\n「50万〜300万円・戸建て」を1日眺める"
    sub: "買わなくていい。どんな家が、いくらで出ているかを知るだけ"
    cta: "数字の見方と確認の一覧は note に ▶"
    lines:
      - {sp: 答, text: "今日の一歩。ポータルサイトで、50万から300万円、戸建て、で検索する。", st: "喜び", face: happy}
      - {sp: 答, text: "買わなくていい。1日眺めて、どんな家がいくらで出ているかを知るだけで十分です。", st: "ノーマル"}
      - {sp: 聞, text: "数字の見方と、買う前の確認の一覧は、概要欄のnoteにまとめてあります！", st: "あまあま", face: happy, pause: 1.0}
