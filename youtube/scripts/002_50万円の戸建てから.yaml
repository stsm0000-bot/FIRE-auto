# 長尺 ― 実例シリーズ「50万円の戸建てから、家賃収入を積み上げる」物語版 v6（モデルケース版）
# 語り手: 答＝コツさん（不動産の仕入れと販売を仕事にしている大家キャラ。「こういうやり方もある」というモデルケースを案内する役）。
#         聞＝ぽん太（皮算用が得意な会社員・視聴者役）。
#
# ■ v6 の狙い（v5 から。本人の指示: 戸建てを 1 戸ずつ積み上げる投資は本人の体験ではない）
#   - 物件・数字・失敗（見積りが膨らむ／5 千円欲張って空室）は全部「モデルケース（説明のための例）」として語る。
#     コツさんが当事者として「買った」「私の家」「私が損した」と言う台詞は無くす。
#   - 場面の入り口で 1 回だけ「ここからはモデルケース」と言い（house_meet の最後）、以降の主語は「この大家さん」「この例では」。
#     毎台詞に「例えば」を付けない。出来事は現在形・仮定（「〜する」「〜とします」「よくあるのは〜」）で語る。
#   - 冒頭の数字のフックは残す（0〜3 秒に「買値50万円・家賃7万円」）。所有を示さない言い方にし、
#     画面の headline に 0 秒から「モデルケース」、台詞では hook2 の頭（約 12 秒）で「数字はモデルケース」と言う。
#   - 自己紹介は「不動産の仕入れと販売を仕事にしている大家、コツさん」。戸建てを買っているとは言わない。
#   - オープンループは「最後に、この例でいちばん高くついた失敗も。ヒントは5千円の欲」。締めの quote は「この例から分かること」。
#   - 写真 2 枚はイメージ写真（caption に「イメージ写真」と出す）。
#   - 構成（山 4 つ・34 場面・scene と図解の交互・note への送客 2 か所・コメントの問い 1 つ・ending 20 秒以上）は v5 のまま。
#
# ■ 推定尺（台詞の文字数 × 0.165 秒 ＋ 台詞ごとの間 0.3 秒（pause 指定はその値）＋ 場面ごとの間 0.6 秒（章扉 0.8））
#   台詞 135・文字数 約2,940・場面 34 → 約 9 分 10 秒（v5 は同じ式で 8 分 50 秒。「モデルケース」の断りで +20 秒。公開前に本番音声で実測すること）
#
# ■ ★ 公開前に、相場として妥当かを確認する数字（モデルケースの前提。台詞 text には ★ を入れない。ここで管理する）
#   ★1 買値: 50 万円・築 50 年・再建築不可。区部（板橋区・足立区の例示）でこの値段は出にくい。ポータルで出物の幅を見て、
#       区部では少ないなら c1_list の言い方を「郊外・地方なら出る」寄りに直す
#   ★2 直し代: 見積り 150 万円（床・水回り・内装一式）が築 50 年の戸建てとして妥当か。屋根裏の雨漏りで ＋60 万円（210 万円）の幅も。
#       内訳の大きい順（屋根・水回り・床・壁）
#   ★3 諸費用: 約 40 万円（仲介手数料 33 万円＋登記・不動産取得税・火災保険 約 7 万円）。
#       仲介手数料は 2024 年 7 月の改正で、800 万円以下の家・土地（売買・交換）は売主・買主それぞれから上限 30 万円＋税＝税込 33 万円。
#       上限であって定額ではない（媒介契約の前に説明を受け、書面で合意）。この例は上限で計算。登記・取得税・保険の 7 万円が妥当か
#   ★3' 融資: 築 50 年・再建築不可は融資が付きにくい、という前提（この例は現金 300 万円）
#   ★4 家賃: 戸建て 7 万円が場所に対して妥当か。相場 7 万円を 7 万 5 千円で募集 → 4 か月空室 → 7 万円で翌週に決まる、が例としてありうるか
#   ★5 税・経費: 固定資産税 年 3 万円・修繕の積み立て 年 10 万円・空室 1 か月ぶん 7 万円 → 手残り 64 万円。
#       管理会社の管理料（家賃の 5％前後＝年 4 万円程度）と所得税を入れていない。入れるなら c3_cost・c3_rent・年表を直す
#   ★6 空室: 工事 4 か月・空室 4 か月・買ってから鍵を渡すまで 8 か月。年 1 か月の空室見込みが戸建てとして妥当か
#   ★7 年表（モデルケースの計算）: 貯金 300 万円から 1 戸目（総額 300 万円）。2 戸目からは買う前に屋根裏を見て 1 戸 240 万円（買値 50＋直し 150＋諸費用 40）。
#       手残り（1 戸 年 64 万円）＋給料から年 100 万円の貯金で、3 年目 3 戸・5 年目 5 戸・8 年目 12 戸
#       （2 年目末 284 万 → 2 戸目、3 年目末 272 万 → 3 戸目、4 年目末 324 万 → 4 戸目、5 年目末 440 万 → 5 戸目、
#        6 年目末 620 万 → 2 戸、7 年目末 688 万 → 2 戸、8 年目末 884 万 → 3 戸で 12 戸。この式で閉じる）
#   ★8 管理: 管理会社に任せ、大家がやるのは月 1 回通帳を見ること（一般的な任せ方として）
#   ★9 note の具体物: 「買う前の確認 12 項目のチェック表」「見積りの内訳表」を note 側に実際に置く
#   ★10 写真 2 枚: scripts/photos/room_before.jpg（床・水回り）, scripts/photos/room_after.jpg。イメージ写真として使う。外観・表札・窓の外は写さない
#
id: "002"
kind: long
title: "50万円の家を家賃7万円で貸すやり方｜失敗2つ込み"
question: "50万円の家を家賃7万円で貸すまでに、何が起きるか"
note_url: "https://note.com/dokechi_hudousan"
disclaimer: "登場する物件・数字は説明のためのモデルケースです。写真はAIで作ったイメージです。個別のご相談・物件のご紹介は承っておりません"
thumbnail:
  big: "直したら\n300万円"
  sub: "50万円の家のモデルケース"
publish:
  lead: "買値50万円・築50年の戸建てを直して、家賃7万円で貸す。そんなやり方を、モデルケースの数字で追います。直しの見積りが60万円膨らむ失敗、家賃を5千円欲張って4か月空室になる失敗、12戸まで積み上げる年表まで。数字は説明のための例です。"
  tags: [不動産投資, 大家, ボロ戸建て, 戸建て投資, 小規模大家, 家賃収入, 築古戸建て, 利回り, 会社員]
speakers:
  聞: {speaker: "ずんだもん", style: "ノーマル", name: "ぽん太", color: "#2F80ED", char: "ぽん太"}
  答: {speaker: "青山龍星", style: "ノーマル", name: "コツさん", color: "#FF7A1A", char: "コツさん"}
voice: {speed: 1.1, intonation: 1.3}

scenes:
  # ================================================================
  # フック（0:00〜0:12）: 結果の数字を 0〜3 秒で画面と台詞に。画面には 0 秒から「モデルケース」。挨拶なし
  # ================================================================
  - id: hook
    layout: scene
    bg: house_old
    time: day
    camera: in
    chars:
      - {who: ぽん太, at: left, act: stand, face: normal}
      - {who: コツさん, at: right, act: point, face: normal}
    props:
      - {kind: headline, text: "モデルケース：家賃7万円の家、買値50万円", step: 1}
      - {kind: price, text: "50万円", at: center, step: 1}
      - {kind: price, text: "直したら 300万円", at: center, step: 2}
      - {kind: exclaim, who: ぽん太, step: 3}
    steps: 3
    lines:
      - {sp: 答, text: "買値50万円の家を、家賃7万円で貸す。そんなやり方があります。", step: 1, st: "喜び", face: happy}
      - {sp: 答, text: "直したら、全部で300万円。", step: 2, st: "ノーマル", face: calm, pause: 0.4}
      - {sp: 聞, text: "えっ、50万円の家が、300万円！？", step: 3, st: "あまあま", face: surprised}

  # ---- 〜25 秒: 「数字はモデルケース」→「ただし」→ 見終わるとこうなる ＋ オープンループ（同じ家の前で）
  - id: hook2
    layout: scene
    bg: house_old
    time: day
    camera: pan_right
    chars:
      - {who: ぽん太, at: left, act: stand, face: surprised}
      - {who: コツさん, at: right, act: point, face: normal}
    props:
      - {kind: bubble, text: "失敗も2つ込み", who: コツさん, step: 1}
      - {kind: headline, text: "見終わると：買値・直し・家賃で家を見る目", step: 1}
      - {kind: sign, text: "最後に：いちばん高くついた失敗", at: center, step: 2}
      - {kind: question, who: ぽん太, step: 2}
    steps: 2
    lines:
      - {sp: 答, text: "数字は、説明のためのモデルケース。ただし、失敗も2つ込み。", step: 1, st: "ノーマル"}
      - {sp: 答, text: "見終わると、買値、直し、家賃で、家を見る目がつく。", step: 1, st: "ノーマル"}
      - {sp: 答, text: "最後に、この例でいちばん高くついた失敗も。ヒントは、5千円の欲。", step: 2, st: "囁き", face: calm, pause: 0.5}

  # ---- 自己紹介（コツさんの名乗り 1 台詞・固定文。ぽん太は night で名乗る）
  - id: intro
    layout: title
    cast: true
    heading: "不動産の仕入れと販売を仕事にしている\n大家のコツさんです"
    sub: "数字は説明のためのモデルケース"
    lines:
      - {sp: 答, text: "不動産の仕入れと販売を仕事にしている大家、コツさんです。", st: "ノーマル"}

  # ================================================================
  # 物語の入口: ぽん太の夜 → 週末の散歩 → コツさんに出会う
  # ================================================================
  - id: night
    layout: scene
    bg: night
    time: night
    camera: pan_left
    chars:
      - {who: ぽん太, at: center, act: walk, face: calm}
    props:
      - {kind: headline, text: "ある平日、23時", step: 1}
      - {kind: price, text: "家賃 8万円", at: right, step: 2}
      - {kind: question, who: ぽん太, step: 2}
    steps: 2
    lines:
      - {sp: 聞, text: "会社員のぽん太、今日も終電。", step: 1, st: "ささやき", face: calm, speed: 0.95}
      - {sp: 聞, text: "家賃8万円を、払う側。もらう側には、なれないのかな。", step: 2, st: "ノーマル", face: doubt, pause: 0.6}

  - id: street
    layout: scene
    bg: street
    time: day
    weather: sun
    camera: pan_right
    chars:
      - {who: ぽん太, at: offleft, act: walk, face: normal}
      - {who: コツさん, at: right, act: think, face: calm}
    props:
      - {kind: headline, text: "週末の昼、散歩の途中", step: 1}
      - {kind: question, who: ぽん太, step: 1}
    steps: 1
    lines:
      - {sp: 聞, text: "週末、散歩に出たら……ボロい家の前で、ずっと何か見てる人。", step: 1, st: "ヒソヒソ", face: doubt}

  # ---- 山①の入口: 50万円の家（驚き）。最後の台詞で「ここからはモデルケース」を 1 回だけ言う
  - id: house_meet
    layout: scene
    bg: house_old
    time: day
    camera: in
    chars:
      - {who: ぽん太, at: left, act: stand, face: normal}
      - {who: コツさん, at: right, act: point, face: calm}
    props:
      - {kind: sign, text: "売家", at: center, step: 1}
      - {kind: bubble, text: "買って貸す人も", who: コツさん, step: 2}
      - {kind: sweat, who: ぽん太, step: 3}
      - {kind: price, text: "500万円？", at: left, step: 4}
      - {kind: cross, at: left, step: 5}
      - {kind: price, text: "50万円", at: center, step: 5}
      - {kind: exclaim, who: ぽん太, step: 6}
      - {kind: headline, text: "ここからはモデルケース", step: 7}
    steps: 7
    lines:
      - {sp: 聞, text: "この家、どうかしたんですか？", step: 1, st: "ノーマル"}
      - {sp: 答, text: "こういう家を買って、貸す人がいるんです。", step: 2, st: "喜び", face: happy}
      - {sp: 聞, text: "買う！？ この、雑草だらけの家を！？", step: 3, st: "あまあま", face: surprised}
      - {sp: 答, text: "値段、いくらだと思います？", step: 3, st: "ノーマル"}
      - {sp: 聞, text: "……500万円、くらい？", step: 4, st: "ノーマル", face: doubt, pause: 0.6}
      - {sp: 答, text: "50万円。", step: 5, st: "喜び", face: happy, pause: 0.6}
      - {sp: 聞, text: "えっ、50万円で家！？ 中古車より安い！", step: 6, st: "あまあま", face: surprised}
      - {sp: 答, text: "ここからはモデルケース。この家を買う大家さんの数字を追います。", step: 7, st: "ノーマル", face: calm}

  # ================================================================
  # 第1章: 50万円の家は、なぜ安いのか（山①）
  # ================================================================
  - id: c1
    layout: chapter
    heading: "50万円の家は、なぜ安いのか"
    lines:
      - {sp: 答, text: "まず、なぜ50万円なのか。安い理由から。", st: "ノーマル"}

  - id: house_why
    layout: scene
    bg: house_old
    time: day
    camera: in
    chars:
      - {who: ぽん太, at: left, act: stand, face: doubt}
      - {who: コツさん, at: right, act: point, face: normal}
    props:
      - {kind: sign, text: "築50年", at: left, step: 1}
      - {kind: sign, text: "再建築不可", at: center, step: 2}
      - {kind: sweat, who: ぽん太, step: 3}
      - {kind: sign, text: "相続", at: right, step: 4}
      - {kind: arrow, text: "値段が落ちる", dir: down, at: center, step: 5}
    steps: 5
    lines:
      - {sp: 答, text: "安い理由は3つ。1つ目、築50年。", step: 1, st: "ノーマル"}
      - {sp: 答, text: "2つ目、再建築ができない土地。", step: 2, st: "ノーマル"}
      - {sp: 聞, text: "再建築不可って、建て替えられないってことですよね？", step: 3, st: "ツンツン", face: doubt}
      - {sp: 聞, text: "それ、売れないんじゃ……。", step: 3, st: "ツンツン", face: doubt}
      - {sp: 答, text: "売りにくい。だから安い。3つ目、相続で持て余した家。", step: 4, st: "ノーマル"}
      - {sp: 答, text: "売る側は、早く手放したい。それで値段が落ちる。", step: 5, st: "しっとり", face: calm}

  - id: c1_list
    layout: list
    heading: "安い戸建てが出てくる場所"
    items:
      - {text: "東京都内の区部にもある", note: "板橋区・足立区など"}
      - {text: "郊外なら、もっと出る", note: "駅から遠い・バス便"}
      - {text: "借りたい人はいる", note: "月7万円で庭つきの戸建て"}
    lines:
      - {sp: 答, text: "東京都内の区部でも出ます。板橋区、足立区あたり。", step: 1, mark: 1, st: "喜び"}
      - {sp: 聞, text: "都内でも！？", mark: 1, st: "あまあま", face: surprised}
      - {sp: 答, text: "郊外なら、もっと出る。駅から遠い、バスの便の家。", step: 2, mark: 2, st: "ノーマル"}
      - {sp: 聞, text: "でも、そんな家を借りる人、本当にいますか？", st: "ツンツン", face: doubt}
      - {sp: 答, text: "います。月7万円で庭つきの戸建てに住みたい人は、思うより多い。", step: 3, mark: 3, st: "熱血", face: fire}

  # ---- 内見（イメージ写真 1 枚目）→ クイズ
  - id: room_old
    layout: scene
    bg: room_old
    camera: in
    chars:
      - {who: ぽん太, at: left, act: shock, face: surprised}
      - {who: コツさん, at: right, act: point, face: calm}
    props:
      - {kind: photo, image: photos/room_before.jpg, caption: "イメージ写真：ボロ家の室内", x: 50, step: 1}
      - {kind: sweat, who: ぽん太, step: 2}
      - {kind: question, who: コツさん, step: 3}
      - {kind: bubble, text: "直しも50万円？", who: ぽん太, step: 4}
      - {kind: stamp, text: "150万円", x: 50, step: 5}
      - {kind: exclaim, who: ぽん太, step: 6}
    steps: 6
    lines:
      - {sp: 答, text: "中は、たとえばこう。床が傾いて、水回りはそのままでは使えない。", step: 1, st: "しっとり", face: calm}
      - {sp: 聞, text: "うわ……。住めないですよね、これ。", step: 2, st: "ヒソヒソ", face: doubt}
      - {sp: 答, text: "ここでクイズ。貸せる状態にするのに、いくらかかると思います？", step: 3, st: "ノーマル"}
      - {sp: 聞, text: "50万円の家だから……直しも50万円くらい？", step: 4, st: "ノーマル", face: doubt, pause: 0.8}
      - {sp: 答, text: "この例の見積りは150万円。買値の3倍。安い家は、直しのほうが高い。", step: 5, st: "喜び"}
      - {sp: 聞, text: "3倍、ですか……。", step: 6, st: "ノーマル", face: surprised}

  # ---- 買付・契約 → 「買値・直し・家賃の順」をここで 1 台詞
  - id: office
    layout: scene
    bg: office
    camera: still
    chars:
      - {who: コツさん, at: left, act: sit, face: normal}
      - {who: ぽん太, at: right, act: stand, face: surprised}
    props:
      - {kind: stamp, text: "契約", at: center, step: 1}
      - {kind: money, text: "50万円", x: 37, x_fixed: true, step: 2}
      - {kind: price, text: "諸費用 約40万円", x: 50, x_fixed: true, step: 3}
      - {kind: sweat, who: ぽん太, step: 4}
    steps: 4
    lines:
      - {sp: 答, text: "この大家さんは、買付を入れて、契約。", step: 1, st: "喜び", face: happy}
      - {sp: 聞, text: "ほんとに買うんですね……。", step: 2, st: "あまあま", face: surprised}
      - {sp: 答, text: "買値50万円に、仲介手数料、登記、保険。諸費用で、約40万円。", step: 3, st: "ノーマル"}
      - {sp: 聞, text: "えっ、買値と同じくらい！？", step: 4, st: "あまあま", face: surprised}

  # ---- 仲介手数料の決まり（2024 年 7 月の改正。本人の指摘で足した。docs/15 §6.1）
  - id: c1_fee
    layout: list
    heading: "仲介手数料（2024年7月から）"
    items:
      - {text: "800万円以下の家・土地は上限 税込33万円", note: "売主・買主それぞれ。売買・交換のみ"}
      - {text: "上限であって、定額ではない", note: "もっと安いこともある"}
      - {text: "媒介契約の前に、説明と書面の合意", note: "この例は上限で計算"}
    lines:
      - {sp: 答, text: "800万円以下の家や土地は、仲介手数料の上限が、税込33万円。", step: 1, mark: 1, st: "ノーマル"}
      - {sp: 答, text: "2024年7月からの決まりです。", mark: 1, st: "ノーマル"}
      - {sp: 答, text: "上限なので、決まった額ではない。もっと安いこともある。", step: 2, mark: 2, st: "ノーマル"}
      - {sp: 答, text: "媒介契約の前に説明を受けて、書面で合意する。この例は、上限で計算します。", step: 3, mark: 3, st: "ノーマル", face: calm}
      - {sp: 聞, text: "安い家ほど、手数料の割合が重いんですね。", st: "ノーマル", face: doubt}
