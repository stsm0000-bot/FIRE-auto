# 長尺 ― 実例シリーズ「50万円の戸建てから、家賃収入を積み上げる」物語版 v5（収益化に特化）
# 語り手: 答＝コツさん（大家本人・私）。聞＝ぽん太（皮算用が得意な会社員・視聴者役）。
#
# ■ v5 の狙い（v4 に、品質部 2 回転目「直す 5 つ」（docs/11 §10）の 4 番を反映）
#   - 0〜3秒で結果の数字（家賃7万円・買値50万円）を画面と台詞に出し、4秒でサムネの数字（直したら300万円）、
#     その直後にぽん太のギャップ（「50万円の家が、300万円！？」）→ コツさんの「ただし、失敗も2つ込み」。挨拶から始めない。
#     hook2 は同じ家の前（空だけの画にしない）。
#   - 〜21秒で「見終わるとこうなる」＋オープンループ（最後に1戸目で損した金額を言う。ヒントは5千円の欲）。
#   - 自己紹介はコツさんの名乗り 1 台詞（hook2 の直後・約 6 秒）。ぽん太の名乗りは night の台詞に吸収（「会社員のぽん太、今日も終電」）。
#   - 物語の入口は night 2 行 → street 1 行（「家賃を払う側／もらう側」の対比を night に）。第 1 章の扉は推定 1:00（v4 は同じ式で 1:08・実測 1:11）。
#     さらに早めるなら intro の 1 台詞を短く（−2 秒）。house_meet（山①）は削らない。
#   - 全 34 場面のうち 18 場面が scene（キャラが場所に立つ物語）、残りは数字の図解。交互に置く。
#   - 山は 4 つ: ①50万円の家を見つける（驚き） ②見積りが 80 万円膨らむ（失敗1） ③通帳に 7 万円（達成）
#     ④12 戸の未来図 →「でも 1 戸目は…」（5 千円欲張って 4 か月空室＝オープンループの回収、失敗2）
#   - v4 からの削除: c1_counter（買値 50 万円の再掲）と wrap（view と重複）。「買値・直し・家賃の順」は office の末尾に 1 台詞で残す。
#   - desk を 2 場面に: desk（総額 220 万円の counter 小道具）→ c2_counter（layout: counter で「表面の利回り 38％」）。
#     「3 年ちょっとで元が取れる」は c3_compare に残し、desk からは削る。
#   - 年表に「2 戸目からは屋根裏を見て 1 戸 220 万円」の 1 台詞（★7 の資金が閉じる）。「管理できるんですか／月 1 回通帳」は bankbook へ。
#   - 締め（view → street2 → ending）は約 50 秒。ending は 20 秒以上（終了画面の要素を置く時間。次回予告つき）。
#   - note への送客 2 か所（bar 場面「見積りの内訳の一覧表」／ ending「確認 12 項目のチェック表と見積りの内訳表」）
#   - コメントを促す問い 1 つ（street2「地元で 100 万円以下の家、見たことありますか？」）
#   - 1 台詞 1 変化: scene は props の step、図解は step/mark を台詞ごとに進める。1 台詞は 50 字以内（同じ画が 8 秒を超えない）。
#   - v3→v4 で入れたもの（写真 2 枚・キャラ名で名乗る・諸費用 20 万を足して総額 300 万・年表に手残り以外の原資）はそのまま。
#
# ■ 推定尺（台詞の文字数 × 0.165 秒 ＋ 台詞ごとの間 0.3 秒（pause 指定はその値）＋ 場面ごとの間 0.6 秒（章扉 0.8））
#   台詞 132・文字数 約2,820・場面 34 → 約 8 分 50 秒（v4 は同じ式で 9 分 24 秒・実測 9 分 49 秒だったので、実測は 9 分 10 秒前後の見込み。公開前に本番音声で実測すること）
#
# ■ ★ 公開前に本人が実態に合わせて直す数字・事実（台詞 text には ★ を入れない。ここで管理する）
#   ★1 買値 50 万円・築 50 年・東京都内の区部（板橋区・足立区の例示）
#   ★2 直しの見積り 150 万円 → 実際 230 万円（原因＝屋根裏の雨漏り）。内訳の順（屋根・水回り・床・壁）
#   ★3 諸費用 20 万円（仲介手数料・登記・不動産取得税・火災保険）
#   ★3' 膨らんだ 80 万円は銀行に断られて貯金から出した（1 戸目は現金 300 万円）
#   ★4 家賃 7 万円。相場 7 万円のところを 7 万 5 千円で募集 → 4 か月空室 → 7 万円に下げて翌週に決まった
#   ★5 固定資産税 年 3 万円・修繕の積み立て 年 10 万円・空室 1 か月ぶん 7 万円 → 手残り 64 万円
#   ★6 工事 4 か月・空室 4 か月・買ってから鍵を渡すまで 8 か月
#   ★7 年表: 貯金 300 万円から 1 戸目（総額 300 万円）。2 戸目からは買う前に屋根裏を見て 1 戸 220 万円（買値 50＋直し 150＋諸費用 20）。
#       手残り（1 戸 年 64 万円）＋給料から年 100 万円の貯金で、3 年目 3 戸・5 年目 6 戸・8 年目 12 戸
#       （2 年目末 284 万 → 2 戸目、3 年目末 292 万 → 3 戸目、5 年目末 500 万 → 2 戸、8 年目末 860 万 → 3 戸で 12 戸以上。この式で閉じる）
#   ★8 管理は管理会社に任せ、本人がやるのは月 1 回通帳を見ること
#   ★9 note の具体物: 「買う前の確認 12 項目のチェック表」「見積りの内訳表」を note 側に実際に置く
#   ★10 写真 2 枚: scripts/photos/room_before.jpg（床・水回り）, scripts/photos/room_after.jpg（同じ場所）。外観・表札・窓の外は写さない
#
id: "002"
kind: long
title: "50万円の家を買い、家賃7万円が入るまで｜失敗2つ込み"
question: "50万円の家を買って、家賃が入るまでに何が起きたか"
note_url: "https://note.com/dokechi_hudousan"
disclaimer: "物件・数字は特定を避けるため丸めています。個別のご相談・物件のご紹介は承っておりません"
thumbnail:
  big: "直したら\n300万円"
  sub: "50万円の家"
publish:
  lead: "買値50万円・築50年の戸建てを買って、家賃7万円が通帳に入るまでの全部の数字。直しの見積りが80万円膨らんだ話、5千円欲張って4か月空室にした話、12戸まで積み上げた年表を、丸めた実数で。"
  tags: [不動産投資, 大家, ボロ戸建て, 戸建て投資, 小規模大家, 家賃収入, 築古戸建て, 利回り, 会社員]
speakers:
  聞: {speaker: "ずんだもん", style: "ノーマル", name: "ぽん太", color: "#2F80ED", char: "ぽん太"}
  答: {speaker: "青山龍星", style: "ノーマル", name: "コツさん", color: "#FF7A1A", char: "コツさん"}
voice: {speed: 1.1, intonation: 1.3}

scenes:
  # ================================================================
  # フック（0:00〜0:08）: 結果の数字を 0〜3 秒で画面と台詞に。4 秒でサムネの数字、直後にぽん太のギャップ。挨拶なし
  # ================================================================
  - id: hook
    layout: scene
    bg: house_old
    time: day
    camera: in
    chars:
      - {who: ぽん太, at: left, act: stand, face: normal}
      - {who: コツさん, at: right, act: point, face: normal}
    props:
      - {kind: headline, text: "家賃7万円の家、買値50万円", step: 1}
      - {kind: price, text: "50万円", at: center, step: 1}
      - {kind: price, text: "直したら 300万円", at: center, step: 2}
      - {kind: exclaim, who: ぽん太, step: 3}
    steps: 3
    lines:
      - {sp: 答, text: "家賃、月7万円。買値、50万円。", step: 1, st: "喜び", face: happy}
      - {sp: 答, text: "直したら、全部で300万円。", step: 2, st: "ノーマル", face: calm, pause: 0.4}
      - {sp: 聞, text: "えっ、50万円の家が、300万円！？", step: 3, st: "あまあま", face: surprised}

  # ---- 〜21 秒: 「ただし」→ 見終わるとこうなる ＋ オープンループ（同じ家の前で。空だけの画にしない）
  - id: hook2
    layout: scene
    bg: house_old
    time: day
    camera: pan_right
    chars:
      - {who: ぽん太, at: left, act: stand, face: surprised}
      - {who: コツさん, at: right, act: point, face: normal}
    props:
      - {kind: bubble, text: "失敗も2つ込み", who: コツさん, step: 1}
      - {kind: headline, text: "見終わると：買値・直し・家賃で家を見る目", step: 1}
      - {kind: sign, text: "最後に：1戸目で損した金額", at: center, step: 2}
      - {kind: question, who: ぽん太, step: 2}
    steps: 2
    lines:
      - {sp: 答, text: "ただし、失敗も2つ込み。見終わると、買値、直し、家賃で、家を見る目がつく。", step: 1, st: "ノーマル"}
      - {sp: 答, text: "最後に、1戸目で損した金額も。ヒントは、5千円の欲。", step: 2, st: "囁き", face: calm, pause: 0.5}

  # ---- 自己紹介（コツさんの名乗り 1 台詞・固定文。ぽん太は night で名乗る）
  - id: intro
    layout: title
    cast: true
    heading: "不動産の仕入れと販売の仕事をしながら\n自分でも小さい物件を買っている大家です"
    sub: "数字は丸めた実数・場所は区まで"
    lines:
      - {sp: 答, text: "本業は不動産の仕入れと販売。自分でも小さい物件を買っている、コツさんです。", st: "ノーマル"}

  # ================================================================
  # 物語の入口（0:28〜）: ぽん太の夜 → 週末の散歩 → コツさんに出会う
  # ================================================================
  - id: night
    layout: scene
    bg: night
    time: night
    camera: pan_left
    chars:
      - {who: ぽん太, at: center, act: walk, face: calm}
    props:
      - {kind: headline, text: "ある平日、23時", step: 1}
      - {kind: price, text: "家賃 8万円", at: right, step: 2}
      - {kind: question, who: ぽん太, step: 2}
    steps: 2
    lines:
      - {sp: 聞, text: "会社員のぽん太、今日も終電。", step: 1, st: "ささやき", face: calm, speed: 0.95}
      - {sp: 聞, text: "家賃8万円を、払う側。もらう側には、なれないのかな。", step: 2, st: "ノーマル", face: doubt, pause: 0.6}

  - id: street
    layout: scene
    bg: street
    time: day
    weather: sun
    camera: pan_right
    chars:
      - {who: ぽん太, at: offleft, act: walk, face: normal}
      - {who: コツさん, at: right, act: think, face: calm}
    props:
      - {kind: headline, text: "週末の昼、散歩の途中", step: 1}
      - {kind: question, who: ぽん太, step: 1}
    steps: 1
    lines:
      - {sp: 聞, text: "週末、散歩に出たら……ボロい家の前で、ずっと何か見てる人。", step: 1, st: "ヒソヒソ", face: doubt}

  # ---- 山①の入口: 50万円の家（驚き）
  - id: house_meet
    layout: scene
    bg: house_old
    time: day
    camera: in
    chars:
      - {who: ぽん太, at: left, act: stand, face: normal}
      - {who: コツさん, at: right, act: point, face: calm}
    props:
      - {kind: sign, text: "売家", at: center, step: 1}
      - {kind: bubble, text: "買おうかと", who: コツさん, step: 2}
      - {kind: sweat, who: ぽん太, step: 3}
      - {kind: price, text: "500万円？", at: left, step: 4}
      - {kind: cross, at: left, step: 5}
      - {kind: price, text: "50万円", at: center, step: 5}
      - {kind: exclaim, who: ぽん太, step: 6}
    steps: 6
    lines:
      - {sp: 聞, text: "この家、どうかしたんですか？", step: 1, st: "ノーマル"}
      - {sp: 答, text: "買おうかと思って。", step: 2, st: "喜び", face: happy}
      - {sp: 聞, text: "買う！？ この、雑草だらけの家を！？", step: 3, st: "あまあま", face: surprised}
      - {sp: 答, text: "値段、いくらだと思います？", step: 3, st: "ノーマル"}
      - {sp: 聞, text: "……500万円、くらい？", step: 4, st: "ノーマル", face: doubt, pause: 0.6}
      - {sp: 答, text: "50万円。", step: 5, st: "喜び", face: happy, pause: 0.6}
      - {sp: 聞, text: "えっ、50万円で家！？ 中古車より安い！", step: 6, st: "あまあま", face: surprised}

  # ================================================================
  # 第1章: 50万円の家は、なぜ安いのか（山①）
  # ================================================================
  - id: c1
    layout: chapter
    heading: "50万円の家は、なぜ安いのか"
    lines:
      - {sp: 答, text: "まず、なぜ50万円なのか。安い理由から。", st: "ノーマル"}

  - id: house_why
    layout: scene
    bg: house_old
    time: day
    camera: in
    chars:
      - {who: ぽん太, at: left, act: stand, face: doubt}
      - {who: コツさん, at: right, act: point, face: normal}
    props:
      - {kind: sign, text: "築50年", at: left, step: 1}
      - {kind: sign, text: "再建築不可", at: center, step: 2}
      - {kind: sweat, who: ぽん太, step: 3}
      - {kind: sign, text: "相続", at: right, step: 4}
      - {kind: arrow, text: "値段が落ちる", dir: down, at: center, step: 5}
    steps: 5
    lines:
      - {sp: 答, text: "安い理由は3つ。1つ目、築50年。", step: 1, st: "ノーマル"}
      - {sp: 答, text: "2つ目、再建築ができない土地。", step: 2, st: "ノーマル"}
      - {sp: 聞, text: "再建築不可って、建て替えられないってことですよね？", step: 3, st: "ツンツン", face: doubt}
      - {sp: 聞, text: "それ、売れないんじゃ……。", step: 3, st: "ツンツン", face: doubt}
      - {sp: 答, text: "売りにくい。だから安い。3つ目、相続で持て余した家。", step: 4, st: "ノーマル"}
      - {sp: 答, text: "売る側は、早く手放したい。それで値段が落ちる。", step: 5, st: "しっとり", face: calm}

  - id: c1_list
    layout: list
    heading: "安い戸建てが出てくる場所"
    items:
      - {text: "東京都内の区部にもある", note: "板橋区・足立区など"}
      - {text: "郊外なら、もっと出る", note: "駅から遠い・バス便"}
      - {text: "借りたい人はいる", note: "月7万円で庭つきの戸建て"}
    lines:
      - {sp: 答, text: "東京都内の区部でも出ます。板橋区、足立区あたり。", step: 1, mark: 1, st: "喜び"}
      - {sp: 聞, text: "都内でも！？", mark: 1, st: "あまあま", face: surprised}
      - {sp: 答, text: "郊外なら、もっと出る。駅から遠い、バスの便の家。", step: 2, mark: 2, st: "ノーマル"}
      - {sp: 聞, text: "でも、そんな家を借りる人、本当にいますか？", st: "ツンツン", face: doubt}
      - {sp: 答, text: "います。月7万円で庭つきの戸建てに住みたい人は、思うより多い。", step: 3, mark: 3, st: "熱血", face: fire}

  # ---- 内見（写真 1 枚目）→ クイズ
  - id: room_old
    layout: scene
    bg: room_old
    camera: in
    chars:
      - {who: ぽん太, at: left, act: shock, face: surprised}
      - {who: コツさん, at: right, act: point, face: calm}
    props:
      - {kind: photo, image: photos/room_before.jpg, caption: "買ったとき：床と水回り", x: 50, step: 1}
      - {kind: sweat, who: ぽん太, step: 2}
      - {kind: question, who: コツさん, step: 3}
      - {kind: bubble, text: "直しも50万円？", who: ぽん太, step: 4}
      - {kind: stamp, text: "150万円", x: 50, step: 5}
      - {kind: exclaim, who: ぽん太, step: 6}
    steps: 6
    lines:
      - {sp: 答, text: "中はこう。床が傾いて、水回りはそのままでは使えない。", step: 1, st: "しっとり", face: calm}
      - {sp: 聞, text: "うわ……。住めないですよね、これ。", step: 2, st: "ヒソヒソ", face: doubt}
      - {sp: 答, text: "ここでクイズ。貸せる状態にするのに、いくらかかると思います？", step: 3, st: "ノーマル"}
      - {sp: 聞, text: "50万円の家だから……直しも50万円くらい？", step: 4, st: "ノーマル", face: doubt, pause: 0.8}
      - {sp: 答, text: "見積りは150万円。買値の3倍。安い家は、買値より直しのほうが高い。", step: 5, st: "喜び"}
      - {sp: 聞, text: "3倍、ですか……。", step: 6, st: "ノーマル", face: surprised}

  # ---- 買付・契約 → 「買値・直し・家賃の順」をここで 1 台詞（旧 c1_counter の代わり）
  - id: office
    layout: scene
    bg: office
    camera: still
    chars:
      - {who: コツさん, at: left, act: sit, face: normal}
      - {who: ぽん太, at: right, act: stand, face: surprised}
    props:
      - {kind: stamp, text: "契約", at: center, step: 1}
      - {kind: money, text: "50万円", at: center, step: 2}
      - {kind: price, text: "諸費用 20万円", at: right, step: 3}
      - {kind: sweat, who: ぽん太, step: 4}
      - {kind: bubble, text: "買値→直し→家賃", who: コツさん, step: 5}
    steps: 5
    lines:
      - {sp: 答, text: "買付を入れて、契約。", step: 1, st: "喜び", face: happy}
      - {sp: 聞, text: "ほんとに買った……。", step: 2, st: "あまあま", face: surprised}
      - {sp: 答, text: "買値50万円に、仲介手数料や登記、保険で、諸費用が20万円。", step: 3, st: "ノーマル"}
      - {sp: 聞, text: "あ、そこもかかるんだ。", step: 4, st: "ノーマル", face: doubt}
      - {sp: 答, text: "数字は、買値、直し、家賃の順。家賃から見ると、皮算用になる。次は、直し。", step: 5, st: "ノーマル", face: calm}

  # ================================================================
  # 第2章: 直して、貸す（山②＝見積りが膨らむ）
  # ================================================================
  - id: c2
    layout: chapter
    heading: "直して、貸す"
    lines:
      - {sp: 答, text: "直して、貸す。ここからが本体です。", st: "ノーマル"}

  # ---- ぽん太の皮算用（夜の机）: 総額 220 万円まで
  - id: desk
    layout: scene
    bg: desk
    time: night
    camera: in
    chars:
      - {who: ぽん太, at: left, act: sit, face: happy}
      - {who: コツさん, at: right, act: stand, face: calm}
    props:
      - {kind: counter, value: 220, unit: "万円", label: "皮算用の総額", at: center, step: 1}
      - {kind: bubble, text: "年84万円！", who: ぽん太, step: 2}
      - {kind: star, who: ぽん太, step: 2}
    steps: 2
    lines:
      - {sp: 聞, text: "計算しました。50足す150足す20で、総額220万円。", step: 1, st: "あまあま", face: happy}
      - {sp: 聞, text: "家賃7万円で貸せば、年84万円。", step: 2, st: "あまあま", face: happy}

  # ---- 皮算用の続き: 表面の利回り 38％ を大きな数字で
  - id: c2_counter
    layout: counter
    heading: "ぽん太の皮算用：表面の利回り"
    value: 38
    unit: "％"
    sub: "年84万円 ÷ 総額220万円"
    dur: 1.6
