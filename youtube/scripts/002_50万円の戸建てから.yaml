      - {sp: 聞, text: "300万円……。220万円のはずが。", mark: 4, st: "ノーマル", face: doubt}
      - {sp: 答, text: "50万円の家じゃない。300万円の家として見る。", st: "熱血", face: fire}

  # ---- 直したあと（写真 2 枚目）
  - id: room_new
    layout: scene
    bg: room_new
    camera: out
    chars:
