      - {sp: 答, text: "銀行には行った。築50年で再建築不可。貸せません、と。", step: 2, st: "かなしみ", face: calm}
      - {sp: 聞, text: "うわ……。", step: 3, st: "ヒソヒソ", face: doubt}
      - {sp: 答, text: "貯金から出した。だから私の1戸目は、融資なしの現金で300万円。", step: 4, st: "ノーマル", face: calm}

  - id: c2_total
    layout: flow
    heading: "1戸にかかったお金（現実）"
    items:
