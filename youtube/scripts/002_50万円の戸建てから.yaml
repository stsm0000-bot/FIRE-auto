      - {sp: 答, text: "買わなくていい。1日眺めて、どんな家がいくらで出ているかを知るだけで十分です。", st: "ノーマル"}
      - {sp: 聞, text: "買う前の確認12項目のチェック表と、見積りの内訳表は、", st: "あまあま", face: happy, pause: 0.1}
      - {sp: 聞, text: "概要欄のnoteに置いてあります。", st: "あまあま", face: happy}
      - {sp: 答, text: "次回は、50万円の家の探し方。どのサイトを、どう絞るか。", st: "ノーマル"}
      - {sp: 聞, text: "登録して、待っててください。僕も、昼休みに探します。", st: "あまあま", face: happy, pause: 1.0}

# ================================================================
# SNS（docs/12 §7。make_posts.py が文面ファイルにする）
# ================================================================
sns:
  x_thread:
    - "買値50万円の戸建てを、家賃7万円で貸しています。築50年、東京都内の区部。直しの見積りが80万円膨らんだ話と、5千円欲張って4か月空室にした話まで、丸めた実数で動画にしました。（1/6）"
