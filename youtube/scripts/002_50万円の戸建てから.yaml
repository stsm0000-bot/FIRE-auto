      - {sp: 答, text: "7万円に下げたら、翌週に決まった。下げた5千円は、年にして6万円。", step: 2, st: "ノーマル"}
      - {sp: 答, text: "30万円を取り戻すのに5年。貸す前に、相場を確認していれば防げた。", st: "しっとり", face: calm}

  - id: house_new
    layout: scene
    bg: house_new
    time: day
    camera: in
    chars:
      - {who: コツさん, at: center, act: bow, face: happy}
    props:
      - {kind: stamp, text: "契約", at: left, step: 1}
      - {kind: check, at: right, step: 2}
      - {kind: headline, text: "買ってから8か月", step: 3}
    steps: 3
    lines:
      - {sp: 答, text: "鍵を渡した日。", step: 1, st: "喜び", face: happy}
      - {sp: 聞, text: "やっと、大家さんですね。", step: 2, st: "あまあま", face: happy}
      - {sp: 答, text: "買ってから、8か月。直しに4か月、空室に4か月。", step: 3, st: "しっとり", face: calm}
      - {sp: 聞, text: "8か月……。でも、ここから毎月7万円。", step: 3, st: "ノーマル", face: calm}

  # ================================================================
  # 見解 → コメントの問い → まとめ → 今日の一歩（note・次回予告）
  # ================================================================
  - id: view
    layout: quote
    heading: "私の見解"
    text: "安い家の値段は、買値ではなく、直しと確認で決まる"
    caption: "50万円の家ではなく、300万円の家として見る"
    lines:
      - {sp: 答, text: "私の見解。安い家の値段は、買値ではなく、直しと確認で決まる。", step: 1, st: "しっとり"}
      - {sp: 聞, text: "50万円の家、じゃなくて、300万円の家として見る、ですね。", step: 2, st: "ノーマル", face: calm}
      - {sp: 答, text: "そう見ると、買える家と、やめておく家が、分かれてきます。", st: "ノーマル"}

  - id: street2
    layout: scene
    bg: street
    time: evening
    camera: pan_left
    chars:
      - {who: ぽん太, at: left, act: walk, face: happy}
      - {who: コツさん, at: right, act: walk, face: normal}
    props:
      - {kind: bubble, text: "昼休みに見てみます", who: ぽん太, step: 1}
      - {kind: headline, text: "あなたの地元に、100万円以下の家は？", step: 2}
      - {kind: question, who: ぽん太, step: 3}
      - {kind: bubble, text: "コメントで", who: コツさん, step: 4}
    steps: 4
    lines:
      - {sp: 聞, text: "今度の昼休み、ポータルサイトで見てみます。それならできそう。", step: 1, st: "あまあま", face: happy}
      - {sp: 答, text: "それでいい。ところで、あなたの地元で、100万円以下の家、見たことありますか？", step: 2, st: "ノーマル"}
      - {sp: 聞, text: "僕は、まだ気にして見たことがないです。", step: 3, st: "ノーマル", face: doubt}
      - {sp: 答, text: "あれば、区や市まででいいので、コメントで教えてください。", step: 4, st: "喜び", face: happy}

  - id: wrap
    layout: flow
    heading: "今日の話"
    items: ["安い戸建ては、ある", "買値・直し・家賃の順に見る", "失敗は、確認不足から"]
    lines:
      - {sp: 答, text: "今日の話。安い戸建ては、ある。", step: 1, mark: 1, st: "ノーマル"}
      - {sp: 答, text: "数字は、買値、直し、家賃の順に見る。", step: 2, mark: 2, st: "ノーマル"}
      - {sp: 答, text: "失敗は、買う前と貸す前の、確認不足から。", step: 3, mark: 3, st: "しっとり"}

  - id: ending
