      - {kind: sign, text: "募集 7万5千円", at: left, step: 2}
      - {kind: zzz, who: コツさん, step: 3}
      - {kind: calendar, text: "4か月", at: right, step: 4}
      - {kind: stamp, text: "空室", at: center, step: 5}
    steps: 5
    lines:
