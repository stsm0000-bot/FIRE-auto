# ショート（縦 1080x1920）サンプル台本 ― 長尺 001 の第2章を 1 問 1 答に切り出したもの
id: "S001"
kind: short
title: "不動産屋への最初の一通、入れるのは4つ #不動産投資 #大家"
question: "最初の一通に、何を入れる？"
note_url: "https://note.com/dokechi_hudousan"
thumbnail:
  big: "最初の一通\n4つだけ"
  sub: "資料が届く人の書き方"
publish:
  lead: "不動産屋に送る最初の一通。この4つが欠けると聞き返しが入り、2日ずつ遅れます。架空の例で。"
  tags: [不動産投資, 大家, 一棟目, 小規模大家, 物件探し, Shorts]

scenes:
  - id: hook
    layout: title
    heading: "資料が届かないのは\n最初の一通が原因"
    lines:
      - {sp: 答, text: "物件資料が届かないとき、原因の多くは最初の一通にあります。入れるのは4つだけです。"}
  - id: four
    layout: list
    heading: "最初の一通に入れる4つ"
    items:
      - {text: "誰か", note: "会社員・初めての1件"}
      - {text: "いくらまで", note: "買える根拠をひと言"}
      - {text: "どこを", note: "広げすぎない"}
      - {text: "いつ返事できるか", note: "平日の夜・週末"}
    lines:
      - {sp: 答, text: "1、誰か。名前と、会社員で初めての1件だと分かれば足ります。", step: 1}
      - {sp: 答, text: "2、いくらまで。金額に、買える根拠をひと言添えます。", step: 2}
      - {sp: 答, text: "3、どこを。どこでもよい、は相手が決められません。", step: 3}
      - {sp: 答, text: "4、いつ返事できるか。平日の夜、のように書きます。", step: 4}
      - {sp: 聞, text: "どれかが欠けると、どうなりますか。"}
      - {sp: 答, text: "聞き返しが1往復入って、だいたい2日遅れます。説明のための置き方ですが、その間に他の人が同じ資料を見ています。"}
  - id: ending
    layout: ending
    heading: "4つの欄を\n1行ずつ埋めてみる"
    sub: "送るのは、そのあとで"
    lines:
      - {sp: 答, text: "今日の一歩。4つの欄を、自分の言葉で1行ずつ埋めてみてください。送るのはそのあとで構いません。", pause: 0.8}
