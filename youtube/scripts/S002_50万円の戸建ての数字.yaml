    props:
      - {kind: headline, text: "買値50万円 → 1年で残るのは？", step: 1}
      - {kind: price, text: "50万円", at: right, step: 1}
    steps: 1
    lines:
      - {sp: 答, text: "買値50万円の家。貸すと、1年でいくら残る？", step: 1, st: "喜び", face: happy}
  - id: guess
    layout: scene
    bg: desk
    time: night
    camera: still
    chars:
      - {who: ぽん太, at: center, act: sit, face: happy}
    props:
      - {kind: bubble, text: "84万円！", who: ぽん太, step: 1}
      - {kind: sweat, who: ぽん太, step: 2}
