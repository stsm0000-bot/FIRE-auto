    lines:
      - {sp: 答, text: "この7万円が、毎月、通帳に入る。", step: 1, st: "喜び", face: happy}
      - {sp: 答, text: "楽ではない。ただ、大金がないと始められない、は違う。", step: 2, st: "熱血", face: fire}
  - id: ending
    layout: ending
    heading: "ポータルで\n「50万〜300万円・戸建て」を眺める"
    sub: "買わなくていい"
    cta: "見積りが膨らんだ話は長尺で ▶"
    lines:
      - {sp: 答, text: "今日の一歩。ポータルで50万から300万円の戸建てを眺める。買わなくていい。", pause: 0.8}
sns:
  x_single:
