    layout: flow
    heading: "かかったお金"
    items:
      - {text: "買値", value: "50万円"}
      - {text: "直し", value: "230万円", op: "＋"}
      - {text: "諸費用", value: "20万円", op: "＋"}
      - {text: "総額", value: "300万円", op: "＝", sum: true}
    lines:
      - {sp: 答, text: "まず、かかったお金。買値50万円に、直し230万円。", step: 2, mark: 2}
      - {sp: 答, text: "諸費用20万円で、総額300万円。", step: 4, mark: 4, st: "喜び"}
