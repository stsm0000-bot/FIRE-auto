  threads:
    - "買値50万円の戸建て。家賃7万円で貸すと年84万円。ここから固定資産税3万・修繕の積み立て10万・空室1か月ぶん7万を引いて、手残りは64万円。かかったお金は、買値50万＋直し230万＋諸費用20万で300万円。5年弱で戻る計算です。「50万円の家」を「300万円の家」として見ると、買える家とやめておく家が分かれます。あなたなら、300万円で年64万円、どう感じますか？"
