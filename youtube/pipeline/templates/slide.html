<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<style>
:root{
  --w:{{W}}px; --h:{{H}}px;
  --paper:#F6F2EA; --ink:#1B1B1B; --mute:#6B6660; --line:#1B1B1B;
  --accent:#C8321E; --blue:#2F5FB3; --brown:#A3631C; --box:#FFFFFF; --boxon:#E8EEF9; --off:.18;
  --fs-h:64px; --fs-item:54px; --fs-note:36px; --fs-big:92px; --pad:96px; --subband:230px;
}
html[data-kind="short"]{ --fs-h:60px; --fs-item:56px; --fs-note:36px; --fs-big:96px; --pad:64px; --subband:720px; }
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:var(--w);height:var(--h);overflow:hidden;background:var(--paper);
  font-family:"{{FONT}}","Noto Sans JP","BIZ UDPGothic","Meiryo","IPAPGothic",sans-serif;color:var(--ink);
  font-feature-settings:"palt";}
.stage{position:absolute;inset:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;padding:40px var(--pad) 0;height:120px}
.q{font-size:34px;font-weight:700;background:#fff;border:3px solid var(--ink);border-radius:999px;padding:12px 30px;max-width:78%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chap{font-size:34px;font-weight:700;color:var(--mute);letter-spacing:.05em}
.body{flex:1;display:flex;align-items:center;justify-content:center;padding:0 var(--pad);margin-bottom:var(--subband)}
.foot{position:absolute;right:var(--pad);bottom:calc(var(--subband) - 44px);font-size:24px;color:var(--mute)}
html[data-kind="short"] .foot{bottom:90px;right:auto;left:0;width:100%;text-align:center}
html[data-kind="short"] .q{max-width:92%;font-size:30px}
.off{opacity:var(--off)}
.mark{outline:8px solid var(--accent);outline-offset:6px}

/* 章扉 */
.chapter{text-align:center}
.chapter .num{font-size:140px;font-weight:900;color:var(--accent);line-height:1}
.chapter .ttl{font-size:var(--fs-big);font-weight:900;margin-top:24px;line-height:1.25}
/* タイトル */
.title{text-align:center}
.title .big{font-size:var(--fs-big);font-weight:900;line-height:1.3}
.title .sub{font-size:var(--fs-h);color:var(--mute);margin-top:36px;font-weight:700}
/* 見出し共通 */
.h{font-size:var(--fs-h);font-weight:900;margin-bottom:44px;text-align:center}
/* 番号付きの箱 */
.list{width:100%}
.list .row{display:flex;flex-direction:column;gap:22px;max-width:1500px;margin:0 auto}
.box{display:flex;align-items:center;gap:28px;background:var(--box);border:4px solid var(--line);border-radius:22px;padding:22px 40px;
  box-shadow:0 8px 0 rgba(0,0,0,.12);font-size:var(--fs-item);font-weight:700}
.box.on{background:var(--boxon)}
.box .n{display:inline-flex;align-items:center;justify-content:center;width:84px;height:84px;border-radius:50%;background:var(--ink);color:#fff;font-size:48px;font-weight:900;flex:none}
.box .t{flex:1}
.box .note{font-size:var(--fs-note);color:var(--accent);font-weight:700;white-space:nowrap}
/* 流れ（横） */
.flow{width:100%}
.flow .row{display:flex;align-items:center;justify-content:center;gap:18px;flex-wrap:wrap}
.flow .box{flex-direction:column;gap:12px;min-width:360px;text-align:center;padding:30px 34px}
.flow .arrow{font-size:80px;font-weight:900;color:var(--accent)}
html[data-kind="short"] .flow .row{flex-direction:column}
html[data-kind="short"] .flow .arrow{transform:rotate(90deg)}
/* 左右比較 */
.compare{display:flex;gap:40px;width:100%}
html[data-kind="short"] .compare{flex-direction:column}
.col{flex:1;background:var(--box);border:4px solid var(--line);border-radius:26px;padding:40px;box-shadow:0 8px 0 rgba(0,0,0,.12)}
.col.bad{border-color:var(--accent)} .col.good{border-color:#2E7D32}
.ct{font-size:var(--fs-h);font-weight:900;text-align:center;margin-bottom:28px;padding-bottom:18px;border-bottom:4px solid var(--line)}
.col.bad .ct{color:var(--accent)} .col.good .ct{color:#2E7D32}
.ci{font-size:var(--fs-item);font-weight:700;padding:14px 0 14px 54px;position:relative;line-height:1.35}
.ci::before{content:"";position:absolute;left:10px;top:34px;width:22px;height:22px;border-radius:50%;background:var(--ink)}
/* 横棒 */
.bars{width:100%;max-width:1600px}
.brow{display:grid;grid-template-columns:600px 1fr 340px;align-items:center;gap:30px;padding:20px 0;font-size:46px;font-weight:700}
.bl{white-space:nowrap}
html[data-kind="short"] .brow{grid-template-columns:1fr;gap:10px}
.bt{height:64px;background:#fff;border:4px solid var(--line);border-radius:14px;overflow:hidden}
.bf{height:100%;background:var(--accent);min-width:12px}
.bv{color:var(--accent);font-size:var(--fs-note)}
/* 例文 */
.quote{width:100%;max-width:1500px}
.qbox{background:#fff;border:4px solid var(--line);border-radius:26px;padding:48px 56px;font-size:var(--fs-item);font-weight:700;line-height:1.7;white-space:pre-wrap;box-shadow:0 8px 0 rgba(0,0,0,.12)}
.cap{margin-top:30px;font-size:var(--fs-note);color:var(--accent);font-weight:900;text-align:center}
/* 締め */
.ending{width:66%;text-align:left}
html[data-kind="short"] .ending{width:100%;text-align:center}
.eh{display:inline-block;font-size:var(--fs-note);font-weight:900;color:#fff;background:var(--accent);padding:10px 28px;border-radius:999px;margin-bottom:28px}
.eb{font-size:var(--fs-big);font-weight:900;line-height:1.3}
.es{font-size:var(--fs-h);color:var(--mute);margin-top:28px;font-weight:700}
.ecta{margin-top:48px;font-size:var(--fs-h);font-weight:900;color:var(--blue)}
</style></head>
<body><html-data hidden></html-data>
<script>document.documentElement.dataset.kind="{{KIND}}";</script>
<div class="stage">
  <div class="top"><div class="q">問い：{{QUESTION}}</div><div class="chap">{{CHAPTER}}</div></div>
  <div class="body">{{BODY}}</div>
  <div class="foot">{{DISCLAIMER}}</div>
</div>
</body></html>
