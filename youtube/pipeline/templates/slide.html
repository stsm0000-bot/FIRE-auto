<!doctype html>
<html lang="ja" data-kind="{{KIND}}"><head><meta charset="utf-8">
<style>
:root{
  --w:{{W}}px; --h:{{H}}px;
  --paper:#FFF8E7; --ink:#1F2A44; --mute:#6E6A5E; --line:#1F2A44;
  --accent:#FF7A1A; --blue:#2F80ED; --brown:#FF7A1A; --green:#1FA463; --gold:#F2B705; --box:#FFFFFF; --boxon:#FFF1DC; --off:.18;
  --fs-h:64px; --fs-item:54px; --fs-note:36px; --fs-big:92px; --fs-huge:220px; --pad:96px; --subband:230px;
}
html[data-kind="short"]{ --fs-h:60px; --fs-item:56px; --fs-note:36px; --fs-big:96px; --fs-huge:200px; --pad:64px; --subband:720px; }
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:var(--w);height:var(--h);overflow:hidden;background:var(--paper);
  font-family:"{{FONT}}","Noto Sans JP","BIZ UDPGothic","Meiryo","IPAPGothic",sans-serif;color:var(--ink);font-feature-settings:"palt";}
body::before{content:"";position:absolute;inset:0;pointer-events:none;
  background-image:radial-gradient(rgba(255,122,26,.10) 2px,transparent 2.5px);background-size:48px 48px;}
body::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 40%,transparent 60%,rgba(255,122,26,.10) 100%)}
.stage{position:absolute;inset:0;display:flex;flex-direction:column;z-index:1}
.top{display:flex;align-items:center;justify-content:space-between;padding:40px var(--pad) 0;height:120px}
.q{font-size:34px;font-weight:700;background:#fff;border:3px solid var(--ink);border-radius:999px;padding:12px 30px;max-width:78%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chap{font-size:34px;font-weight:700;color:var(--mute);letter-spacing:.05em}
.body{flex:1;display:flex;align-items:center;justify-content:center;padding:0 var(--pad);margin-bottom:calc(var(--subband) + 30px)}
.foot{position:absolute;right:var(--pad);bottom:calc(var(--subband) + 14px);font-size:24px;color:var(--mute)}
html[data-kind="short"] .foot{bottom:90px;right:auto;left:0;width:100%;text-align:center}
html[data-kind="short"] .q{max-width:92%;font-size:30px}
.off{opacity:var(--off)}
.mark{outline:8px solid var(--accent);outline-offset:6px}

/* ---- 動き（Web Animations API で外から時刻を指定して 1 コマずつ撮る） */
@keyframes rise{from{opacity:0;transform:translateY(46px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.72)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:none}}
@keyframes slidein{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:none}}
@keyframes flash{0%{outline-color:transparent}60%{outline-color:var(--accent)}100%{outline-color:var(--accent)}}
.enter{animation:rise .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * .12s)}
.enter.pop{animation-name:pop}
.enter.slide{animation-name:slidein}
.mark.enter{animation:rise .5s cubic-bezier(.2,.8,.2,1) both,flash .6s ease both .25s}
.enter .bf{animation:grow 1s cubic-bezier(.2,.8,.2,1) both .2s;transform-origin:left}

/* 章扉 */
.chapter{text-align:center}
.chapter .num{display:inline-block;font-size:120px;font-weight:900;color:#fff;background:var(--accent);width:200px;height:200px;line-height:200px;border-radius:50%;box-shadow:0 12px 0 rgba(31,42,68,.18)}
.chapter .ttl{font-size:var(--fs-big);font-weight:900;margin-top:24px;line-height:1.25}
/* タイトル */
.title{text-align:center}
.title .big{font-size:var(--fs-big);font-weight:900;line-height:1.3}
.title .sub{font-size:var(--fs-h);color:var(--mute);margin-top:36px;font-weight:700}
.h{font-size:var(--fs-h);font-weight:900;margin-bottom:44px;text-align:center}
/* 番号付きの箱 */
.list{width:100%}
.list .row{display:flex;flex-direction:column;gap:22px;max-width:1500px;margin:0 auto}
.box{display:flex;align-items:center;gap:28px;background:var(--box);border:4px solid var(--line);border-radius:22px;padding:22px 40px;
  box-shadow:0 8px 0 rgba(0,0,0,.12);font-size:var(--fs-item);font-weight:700}
.box.on{background:var(--boxon)}
.box .n{background:var(--accent)!important}
.box .n{display:inline-flex;align-items:center;justify-content:center;width:84px;height:84px;border-radius:50%;background:var(--ink);color:#fff;font-size:48px;font-weight:900;flex:none}
.box .t{flex:1}
.box .note{font-size:var(--fs-note);color:var(--accent);font-weight:700;white-space:nowrap}
/* 流れ（横）・数式 */
.flow{width:100%}
.flow .row{display:flex;align-items:center;justify-content:center;gap:18px;flex-wrap:wrap}
.flow .box{flex-direction:column;gap:12px;min-width:340px;text-align:center;padding:30px 34px}
.flow .box .v{font-size:var(--fs-big);font-weight:900;color:var(--accent);line-height:1.1}
.flow .box.sum .v{color:var(--green)}
.flow .box.sum{background:#fff;border-color:var(--accent)}
.flow .arrow{font-size:80px;font-weight:900;color:var(--accent)}
.flow .op{font-size:90px;font-weight:900;color:var(--ink)}
html[data-kind="short"] .flow .row{flex-direction:column}
html[data-kind="short"] .flow .arrow{transform:rotate(90deg)}
/* 左右比較 */
.compare{display:flex;gap:40px;width:100%}
html[data-kind="short"] .compare{flex-direction:column}
.col{flex:1;background:var(--box);border:4px solid var(--line);border-radius:26px;padding:40px;box-shadow:0 8px 0 rgba(0,0,0,.12)}
.col.bad{border-color:var(--accent)} .col.good{border-color:var(--green)}
.ct{font-size:50px;font-weight:900;text-align:center;margin-bottom:28px;padding-bottom:18px;border-bottom:4px solid var(--line);line-height:1.3}
.col.bad .ct{color:var(--accent)} .col.good .ct{color:var(--green)}
.ci{font-size:var(--fs-item);font-weight:700;padding:14px 0 14px 54px;position:relative;line-height:1.35}
.ci::before{content:"";position:absolute;left:10px;top:34px;width:22px;height:22px;border-radius:50%;background:var(--ink)}
/* 横棒 */
.bars{width:100%;max-width:1600px}
.brow{display:grid;grid-template-columns:600px 1fr 340px;align-items:center;gap:30px;padding:20px 0;font-size:46px;font-weight:700}
.bl{white-space:nowrap}
html[data-kind="short"] .brow{grid-template-columns:1fr;gap:10px}
.bt{height:64px;background:#fff;border:4px solid var(--line);border-radius:14px;overflow:hidden}
.bf{height:100%;background:linear-gradient(90deg,var(--accent),var(--gold));min-width:12px}
.bv{color:var(--accent);font-size:var(--fs-note)}
/* 例文 */
.quote{width:100%;max-width:1500px}
.qbox{background:#fff;border:4px solid var(--line);border-radius:26px;padding:48px 56px;font-size:var(--fs-item);font-weight:700;line-height:1.7;white-space:pre-wrap;box-shadow:0 8px 0 rgba(0,0,0,.12)}
.cap{margin-top:30px;font-size:var(--fs-note);color:var(--accent);font-weight:900;text-align:center}
/* 締め */
.ending{width:66%;text-align:left}
html[data-kind="short"] .ending{width:100%;text-align:center}
.eh{display:inline-block;font-size:var(--fs-note);font-weight:900;color:#fff;background:var(--accent);padding:10px 28px;border-radius:999px;margin-bottom:28px}
.eb{font-size:var(--fs-big);font-weight:900;line-height:1.3}
.es{font-size:var(--fs-h);color:var(--mute);margin-top:28px;font-weight:700}
.ecta{margin-top:48px;font-size:var(--fs-h);font-weight:900;color:var(--blue)}
/* 大きな数字 */
.counter{text-align:center;width:100%}
.counter .lbl{font-size:var(--fs-h);font-weight:900;color:var(--mute)}
.counter .num{font-size:var(--fs-huge);font-weight:900;color:var(--accent);line-height:1.1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.counter.money .num{color:var(--green)}
.counter .num small{font-size:.42em;color:var(--ink);margin-left:12px}
.counter .sub{font-size:var(--fs-item);font-weight:700;margin-top:24px}
/* 戸建ての積み上げ */
.portfolio{display:flex;gap:60px;width:100%;align-items:center}
html[data-kind="short"] .portfolio{flex-direction:column;gap:30px}
.houses{display:grid;grid-template-columns:repeat(var(--cols,6),1fr);gap:22px;flex:1}
.house{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:28px;font-weight:700;color:var(--mute)}
.house svg{width:150px;height:130px}
html[data-kind="short"] .house svg{width:120px;height:104px}
.house.off{opacity:.12}
.totals{width:560px;display:flex;flex-direction:column;gap:22px}
html[data-kind="short"] .totals{width:100%;flex-direction:row;gap:14px}
.tot{background:#fff;border:4px solid var(--line);border-radius:22px;padding:18px 30px;box-shadow:0 8px 0 rgba(0,0,0,.12);flex:1}
.tot .tl{font-size:32px;font-weight:700;color:var(--mute)}
.tot .tv{font-size:76px;font-weight:900;color:var(--green);line-height:1.1;font-variant-numeric:tabular-nums}
.tot .tv small{font-size:.5em;color:var(--ink)}
html[data-kind="short"] .tot .tv{font-size:56px}
/* コインの山 */
.coins{display:flex;align-items:flex-end;justify-content:center;gap:10px;height:150px;margin-top:6px}
.stack{display:flex;flex-direction:column-reverse;align-items:center}
.coin{width:56px;height:14px;border-radius:50%;background:linear-gradient(180deg,#FFD84D,#E0A400);border:3px solid #B88600;margin-top:-10px;box-shadow:0 2px 0 rgba(0,0,0,.15)}
html[data-kind="short"] .coins{height:180px}
/* 紙吹雪 */
.burst{position:absolute;left:50%;top:45%;width:0;height:0;pointer-events:none}
.burst i{position:absolute;width:18px;height:28px;border-radius:4px;opacity:0;animation:confetti 1.3s cubic-bezier(.1,.8,.3,1) forwards;animation-delay:var(--d)}
@keyframes confetti{0%{opacity:0;transform:translate(0,0) rotate(0)}10%{opacity:1}100%{opacity:0;transform:translate(var(--x),var(--y)) rotate(var(--r))}}
/* 年表 */
.timeline{width:100%;max-width:1700px}
.tl-line{position:relative;height:10px;background:var(--ink);border-radius:5px;margin:60px 0 40px}
.tl-items{display:grid;grid-template-columns:repeat(var(--n,4),1fr);gap:20px}
.tl-item{text-align:center}
.tl-item .dot{width:40px;height:40px;border-radius:50%;background:var(--accent);border:6px solid var(--paper);margin:-85px auto 30px;box-shadow:0 0 0 4px var(--ink)}
.tl-item .when{font-size:var(--fs-note);font-weight:900;color:var(--accent)}
.tl-item .what{font-size:var(--fs-item);font-weight:900;line-height:1.3;margin-top:8px}
.tl-item .note{font-size:30px;color:var(--mute);margin-top:8px}
html[data-kind="short"] .tl-items{grid-template-columns:1fr 1fr}
/* 写真（ビフォー／アフター） */
.photos{display:flex;gap:40px;width:100%}
html[data-kind="short"] .photos{flex-direction:column}
.ph{flex:1;background:#fff;border:4px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 8px 0 rgba(0,0,0,.12);position:relative}
.ph img{width:100%;height:560px;object-fit:cover;display:block}
html[data-kind="short"] .ph img{height:420px}
.ph .ph-empty{height:560px;display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(45deg,#eee 0 20px,#e4e0d8 20px 40px);color:var(--mute);font-size:40px;font-weight:700;text-align:center;padding:40px}
html[data-kind="short"] .ph .ph-empty{height:420px}
.ph .tag{position:absolute;top:20px;left:20px;background:var(--ink);color:#fff;font-size:40px;font-weight:900;padding:8px 24px;border-radius:12px}
.ph.after .tag{background:var(--accent)}
.ph .cap{margin:18px 0;font-size:var(--fs-note);color:var(--ink)}
</style></head>
<body>
<div class="stage">
  <div class="top"><div class="q">問い：{{QUESTION}}</div><div class="chap">{{CHAPTER}}</div></div>
  <div class="body">{{BODY}}</div>
  <div class="foot">{{DISCLAIMER}}</div>
</div>
<script>
// 外部（render_frames.js）から時刻を指定され、その時点の画を作る。再生は使わない。
(function(){
  const ease = t => t<0?0:t>1?1:1-Math.pow(1-t,3);
  const fmt = (v, dec) => v.toLocaleString('ja-JP',{minimumFractionDigits:dec,maximumFractionDigits:dec});
  window.__seek = function(ms){
    document.getAnimations().forEach(a => { a.pause(); a.currentTime = ms; });
    document.querySelectorAll('[data-count-to]').forEach(el => {
      const from = +el.dataset.countFrom || 0, to = +el.dataset.countTo, dur = +el.dataset.countDur || 1800, delay = +el.dataset.countDelay || 200;
      const dec = +el.dataset.countDec || 0;
      const v = from + (to - from) * ease((ms - delay) / dur);
      el.textContent = (el.dataset.prefix || '') + fmt(Math.round(v * Math.pow(10,dec)) / Math.pow(10,dec), dec);
    });
  };
  if (location.search.indexOf('static') >= 0) window.__seek(1e7);   // Chrome の静止画撮影用
})();
</script>
</body></html>
