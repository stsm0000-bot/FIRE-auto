<!doctype html>
<html lang="ja" data-kind="{{KIND}}"><head><meta charset="utf-8">
<style>
:root{
  --w:{{W}}px; --h:{{H}}px;
  --paper:#FFF8E7; --ink:#1F2A44; --mute:#6E6A5E; --line:#1F2A44;
  --accent:#FF7A1A; --blue:#2F80ED; --brown:#FF7A1A; --green:#1FA463; --gold:#F2B705; --box:#FFFFFF; --boxon:#FFF1DC; --off:.18;
  /* 文字の階層: 章題(big) ＞ 見出し(h) ＞ 項目(item) ＞ 補足(note) */
  --fs-h:70px; --fs-item:58px; --fs-note:38px; --fs-val:92px; --fs-big:104px; --fs-huge:240px; --pad:96px; --subband:230px;
  --bw:5px; --radius:24px; --shadow:0 10px 0 rgba(31,42,68,.16), 0 18px 28px rgba(31,42,68,.08);
}
html[data-kind="short"]{ --fs-h:64px; --fs-item:58px; --fs-note:38px; --fs-val:88px; --fs-big:100px; --fs-huge:210px; --pad:64px; --subband:720px; }
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:var(--w);height:var(--h);overflow:hidden;background:var(--paper);position:relative;
  font-family:"{{FONT}}","Noto Sans JP","BIZ UDPGothic","Meiryo","IPAPGothic",sans-serif;color:var(--ink);font-feature-settings:"palt";}
body::before{content:"";position:absolute;inset:0;pointer-events:none;
  background-image:radial-gradient(rgba(255,122,26,.11) 2px,transparent 2.5px);background-size:48px 48px;}
body::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 40%,transparent 58%,rgba(255,122,26,.12) 100%)}
.stage{position:absolute;inset:0;display:flex;flex-direction:column;z-index:1}
.top{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:36px var(--pad) 0;height:124px}
.q{font-size:36px;font-weight:900;background:#fff;border:4px solid var(--ink);border-radius:999px;padding:12px 34px;max-width:78%;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 5px 0 rgba(31,42,68,.16)}
.chap{font-size:34px;font-weight:900;color:#fff;background:var(--ink);letter-spacing:.06em;padding:8px 26px;border-radius:999px;font-variant-numeric:tabular-nums;flex:none}
.chap:empty{display:none}
.body{flex:1;display:flex;align-items:center;justify-content:center;padding:0 var(--pad);margin-bottom:calc(var(--subband) + 58px)}
.foot{position:absolute;right:var(--pad);bottom:calc(var(--subband) + 12px);font-size:25px;color:var(--mute);letter-spacing:.02em}
html[data-kind="short"] .foot{bottom:90px;right:auto;left:0;width:100%;box-sizing:border-box;padding:0 64px;font-size:22px;line-height:1.4;text-align:center;text-wrap:balance}
html[data-kind="short"] .q{max-width:92%;font-size:32px}
.off{opacity:var(--off)}
/* 選択中: オレンジの太枠＋わずかに拡大（transform はアニメが使うので scale を別に使う） */
.mark{outline:10px solid var(--accent);outline-offset:8px;scale:1.03;position:relative;z-index:2}

/* ---- 動き（Web Animations API で外から時刻を指定して 1 コマずつ撮る。JS の再生は使わない） */
/* 少し行き過ぎて戻る */
@keyframes rise{0%{opacity:0;transform:translateY(64px) scale(.94)}55%{opacity:1;transform:translateY(-12px) scale(1.02)}80%{transform:translateY(5px) scale(.995)}100%{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.5)}55%{opacity:1;transform:scale(1.1)}78%{transform:scale(.96)}100%{opacity:1;transform:none}}
@keyframes slidein{0%{opacity:0;transform:translateX(-90px)}60%{opacity:1;transform:translateX(14px)}82%{transform:translateX(-4px)}100%{opacity:1;transform:none}}
@keyframes bounce{0%{opacity:0;transform:translateY(90px) scale(.3)}45%{opacity:1;transform:translateY(-26px) scale(1.18)}65%{transform:translateY(10px) scale(.94)}82%{transform:translateY(-6px) scale(1.04)}100%{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:none}}
@keyframes flash{0%{outline-color:transparent}60%{outline-color:var(--accent)}100%{outline-color:var(--accent)}}
.enter{animation:rise .6s cubic-bezier(.22,.9,.3,1) both;animation-delay:calc(var(--i,0) * .12s)}
.enter.pop{animation-name:pop;animation-duration:.55s}
.enter.slide{animation-name:slidein}
.mark.enter{animation:rise .6s cubic-bezier(.22,.9,.3,1) both,flash .6s ease both .25s}
.enter .bf{animation:grow 1s cubic-bezier(.2,.8,.2,1) both .2s;transform-origin:left}
.counter .num.enter{animation-name:bounce;animation-duration:.8s;animation-timing-function:cubic-bezier(.3,.7,.3,1)}

/* 共通の「紙を貼った箱」 */
.box,.col,.qbox,.tot,.ph,.bt{background:var(--box);border:var(--bw) solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}

/* 章扉 */
.chapter{text-align:center}
.chapter .num{display:inline-block;font-size:128px;font-weight:900;color:#fff;background:var(--accent);width:220px;height:220px;line-height:208px;border-radius:50%;
  border:6px solid #fff;box-shadow:0 0 0 6px var(--accent),0 14px 0 rgba(31,42,68,.18)}
.chapter .ttl{font-size:var(--fs-big);font-weight:900;margin-top:36px;line-height:1.25;letter-spacing:.02em}
/* タイトル */
.title{text-align:center}
.title .big{font-size:var(--fs-big);font-weight:900;line-height:1.3;letter-spacing:.01em}
.title .sub{font-size:var(--fs-h);color:var(--mute);margin-top:36px;font-weight:700}
/* 見出し（金のマーカー下線） */
.h{font-size:var(--fs-h);font-weight:900;margin-bottom:44px;text-align:center;line-height:1.3}
.h{background:linear-gradient(transparent 64%,rgba(242,183,5,.55) 64% 92%,transparent 92%);display:table;margin-left:auto;margin-right:auto;padding:0 14px}
/* 番号付きの箱 */
.list{width:100%}
.list .row{display:flex;flex-direction:column;gap:24px;max-width:1540px;margin:0 auto}
.box{display:flex;align-items:center;gap:30px;padding:20px 44px;font-size:var(--fs-item);font-weight:700;line-height:1.3}
.box.on{background:var(--boxon)}
.box .n{display:inline-flex;align-items:center;justify-content:center;width:92px;height:92px;border-radius:50%;background:var(--accent);color:#fff;font-size:52px;font-weight:900;flex:none;
  box-shadow:0 5px 0 rgba(31,42,68,.2)}
.box .t{flex:1}
.box .note{font-size:var(--fs-note);color:var(--accent);font-weight:900;white-space:nowrap;background:#fff;border:3px solid var(--accent);border-radius:999px;padding:6px 22px}
/* 流れ（横）・数式 */
.flow{width:100%}
.flow .row{display:flex;align-items:center;justify-content:center;gap:20px;flex-wrap:wrap}
.flow .box{flex-direction:column;gap:10px;min-width:350px;text-align:center;padding:26px 36px}
.flow .box .v{font-size:var(--fs-val);font-weight:900;color:var(--accent);line-height:1.1;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.flow .box .t{font-size:var(--fs-note);font-weight:900;color:var(--ink);flex:none}
.flow .box.sum .v{color:var(--green)}
.flow .box.sum{background:#fff;border-color:var(--green);box-shadow:0 10px 0 rgba(31,164,99,.22),0 18px 28px rgba(31,42,68,.08)}
.flow .box .note{background:transparent;border:0;padding:0;color:var(--mute)}
.flow .arrow{font-size:84px;font-weight:900;color:var(--accent)}
.flow .op{font-size:96px;font-weight:900;color:var(--ink);line-height:1}
html[data-kind="short"] .flow .row{flex-direction:column}
html[data-kind="short"] .flow .arrow{transform:rotate(90deg)}
/* ショートで数式の箱が 4 つ以上: 縮めて字幕帯に重ねない */
html[data-kind="short"] .flow.n4,html[data-kind="short"] .flow.n5{zoom:.78}
html[data-kind="short"] .flow.n4 .row,html[data-kind="short"] .flow.n5 .row{gap:10px}
html[data-kind="short"] .list.n5,html[data-kind="short"] .list.n6{zoom:.85}
/* 左右比較 */
.compare{display:flex;gap:44px;width:100%}
html[data-kind="short"] .compare{flex-direction:column}
.col{flex:1;padding:30px 36px 28px}
.col.bad{border-color:var(--accent)} .col.good{border-color:var(--green)}
.ct{font-size:56px;font-weight:900;text-align:center;margin:-30px -36px 26px;padding:16px 20px;line-height:1.25;color:#fff;background:var(--ink);
  border-radius:calc(var(--radius) - var(--bw)) calc(var(--radius) - var(--bw)) 0 0}
.col.bad .ct{background:var(--accent)} .col.good .ct{background:var(--green)}
.ci{font-size:var(--fs-item);font-weight:700;padding:10px 0 10px 56px;position:relative;line-height:1.35}
.ci::before{content:"";position:absolute;left:8px;top:30px;width:26px;height:26px;border-radius:50%;background:var(--ink)}
.col.bad .ci::before{background:var(--accent)} .col.good .ci::before{background:var(--green)}
/* 横棒 */
.bars{width:100%;max-width:1640px}
.brow{display:grid;grid-template-columns:600px 1fr 360px;align-items:center;gap:30px;padding:18px 0;font-size:var(--fs-item);font-weight:900}
.bl{white-space:nowrap}
html[data-kind="short"] .brow{grid-template-columns:1fr;gap:10px}
.bt{height:72px;border-radius:18px;overflow:hidden;padding:0}
.bf{height:100%;background:linear-gradient(90deg,var(--accent),var(--gold));min-width:14px;border-radius:0 12px 12px 0}
.bv{color:var(--accent);font-size:var(--fs-note);font-weight:900;font-variant-numeric:tabular-nums}
/* 例文 */
.quote{width:100%;max-width:1540px}
.qbox{padding:44px 56px;font-size:var(--fs-item);font-weight:700;line-height:1.7;white-space:pre-wrap;border-radius:28px;position:relative}
.qbox::before{content:"“";position:absolute;left:22px;top:-26px;font-size:120px;line-height:1;color:var(--gold);font-weight:900}
.cap{margin-top:30px;font-size:var(--fs-note);color:var(--accent);font-weight:900;text-align:center}
/* 締め */
.ending{width:76%;text-align:left}
html[data-kind="short"] .ending{width:100%;text-align:center}
.eh{display:inline-block;font-size:36px;font-weight:900;color:#fff;background:var(--accent);padding:8px 30px;border-radius:999px;margin-bottom:18px;box-shadow:0 5px 0 rgba(31,42,68,.16)}
.eb{font-size:88px;font-weight:900;line-height:1.22}
.es{font-size:54px;color:var(--mute);margin-top:20px;font-weight:700;line-height:1.3}
.ecta{margin-top:26px;font-size:60px;font-weight:900;color:var(--blue)}
/* 大きな数字 */
.counter{text-align:center;width:100%}
.counter .lbl{font-size:var(--fs-h);font-weight:900;color:var(--ink);display:inline-block;padding:0 14px;background:linear-gradient(transparent 64%,rgba(242,183,5,.55) 64% 92%,transparent 92%)}
.counter .num{font-size:var(--fs-huge);font-weight:900;color:var(--accent);line-height:1.1;letter-spacing:-.02em;font-variant-numeric:tabular-nums;
  text-shadow:0 8px 0 rgba(31,42,68,.12)}
.counter.money .num{color:var(--green)}
.counter .num small{font-size:.4em;color:var(--ink);margin-left:14px;text-shadow:none}
.counter .sub{font-size:var(--fs-item);font-weight:700;margin-top:20px}
/* 戸建ての積み上げ */
.portfolio{display:flex;gap:56px;width:100%;align-items:center}
html[data-kind="short"] .portfolio{flex-direction:column;gap:30px}
.houses{display:grid;grid-template-columns:repeat(var(--cols,6),1fr);gap:20px 16px;flex:1}
.house{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:36px;font-weight:900;color:var(--mute);white-space:nowrap}
.house.on{color:var(--ink)}
.house svg{width:156px;height:136px;filter:drop-shadow(0 6px 0 rgba(31,42,68,.14))}
html[data-kind="short"] .house svg{width:120px;height:104px}
.house.off{opacity:.12}
.totals{width:580px;display:flex;flex-direction:column;gap:18px}
html[data-kind="short"] .totals{width:100%;flex-direction:row;gap:14px}
.tot{padding:10px 30px 12px;flex:1}
.tot .tl{font-size:36px;font-weight:900;color:var(--mute);line-height:1.1}
.tot .tv{font-size:80px;font-weight:900;color:var(--green);line-height:1.1;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.tot .tv small{font-size:.48em;color:var(--ink)}
html[data-kind="short"] .tot .tv{font-size:60px}
/* キャラ紹介 */
.cast{display:flex;justify-content:center;gap:120px;margin-top:40px}
html[data-kind="short"] .cast{gap:40px}
.castc{display:flex;flex-direction:column;align-items:center;gap:10px}
.castc svg{width:260px;height:260px}
.cname{color:#fff;font-size:40px;font-weight:900;padding:6px 26px;border-radius:999px}
.cdesc{font-size:30px;color:var(--mute);font-weight:700;max-width:420px;text-align:center;line-height:1.35}
/* コインの山 */
.coins{display:flex;align-items:flex-end;justify-content:center;gap:10px;height:96px;margin-top:0}
.stack{display:flex;flex-direction:column-reverse;align-items:center}
.coin{width:56px;height:16px;border-radius:50%;background:linear-gradient(180deg,#FFD84D,#E0A400);border:3px solid #B88600;margin-top:-6px;box-shadow:0 2px 0 rgba(0,0,0,.15)}
html[data-kind="short"] .coins{height:180px}
/* 紙吹雪（1 粒につき本体＋::before/::after の 3 枚が別方向へ飛ぶ） */
.burst{position:absolute;left:50%;top:42%;width:0;height:0;pointer-events:none;z-index:5}
.burst i{position:absolute;width:30px;height:44px;border-radius:6px;opacity:0;margin:-22px 0 0 -15px;
  animation:confetti 1.7s cubic-bezier(.12,.75,.3,1) forwards;animation-delay:var(--d);box-shadow:0 3px 0 rgba(31,42,68,.18)}
.burst i::before,.burst i::after{content:"";position:absolute;left:0;top:0;width:100%;height:100%;border-radius:inherit;background:inherit;opacity:0;
  animation:confetti2 1.7s cubic-bezier(.12,.75,.3,1) forwards;animation-delay:calc(var(--d) + .06s)}
.burst i::after{border-radius:50%;width:70%;height:50%;animation-name:confetti3;animation-delay:calc(var(--d) + .12s)}
@keyframes confetti{0%{opacity:0;transform:translate(0,0) rotate(0) scale(.3)}
  12%{opacity:1;transform:translate(calc(var(--x) * .3),calc(var(--y) * .3 - 40px)) rotate(calc(var(--r) * .2)) scale(1.35)}
  70%{opacity:1}
  100%{opacity:0;transform:translate(var(--x),calc(var(--y) + 140px)) rotate(var(--r)) scale(.9)}}
@keyframes confetti2{0%{opacity:0;transform:translate(0,0) rotate(0) scale(.3)}
  12%{opacity:1;transform:translate(calc(var(--x) * -.2),calc(var(--y) * -.35 - 30px)) rotate(calc(var(--r) * -.3)) scale(1.1)}
  70%{opacity:1}
  100%{opacity:0;transform:translate(calc(var(--x) * -.7),calc(var(--y) * -.9 + 200px)) rotate(calc(var(--r) * -1)) scale(.8)}}
@keyframes confetti3{0%{opacity:0;transform:translate(0,0) scale(.3)}
  14%{opacity:1;transform:translate(calc(var(--y) * .35),calc(var(--x) * -.25 - 60px)) scale(1.2)}
  70%{opacity:1}
  100%{opacity:0;transform:translate(calc(var(--y) * 1.1),calc(var(--x) * -.6 + 180px)) scale(.7)}}
/* 年表 */
.timeline{width:100%;max-width:1700px}
.tl-line{position:relative;height:12px;background:var(--ink);border-radius:6px;margin:60px 0 40px;box-shadow:0 5px 0 rgba(31,42,68,.14)}
.tl-items{display:grid;grid-template-columns:repeat(var(--n,4),1fr);gap:20px}
.tl-item{text-align:center;padding:0 10px 12px;border-radius:var(--radius)}
.tl-item .dot{width:44px;height:44px;border-radius:50%;background:var(--accent);border:7px solid var(--paper);margin:-88px auto 30px;box-shadow:0 0 0 5px var(--ink)}
.tl-item .when{font-size:var(--fs-note);font-weight:900;color:#fff;background:var(--accent);display:inline-block;padding:4px 22px;border-radius:999px}
.tl-item .what{font-size:var(--fs-item);font-weight:900;line-height:1.3;margin-top:12px}
.tl-item .note{font-size:36px;color:var(--mute);margin-top:8px;font-weight:700}
html[data-kind="short"] .tl-items{grid-template-columns:1fr 1fr}
/* 写真（ビフォー／アフター） */
.photos{display:flex;gap:44px;width:100%}
html[data-kind="short"] .photos{flex-direction:column}
.ph{flex:1;overflow:hidden;position:relative}
.ph img{width:100%;height:540px;object-fit:cover;display:block}
html[data-kind="short"] .ph img{height:420px}
.ph .ph-empty{height:540px;display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(45deg,#eee 0 20px,#e4e0d8 20px 40px);color:var(--mute);font-size:40px;font-weight:700;text-align:center;padding:40px}
html[data-kind="short"] .ph .ph-empty{height:420px}
.ph .tag{position:absolute;top:20px;left:20px;background:var(--ink);color:#fff;font-size:42px;font-weight:900;padding:8px 26px;border-radius:14px;box-shadow:0 5px 0 rgba(31,42,68,.2)}
.ph.after .tag{background:var(--accent)}
.ph .cap{margin:16px 0 18px;font-size:var(--fs-note);color:var(--ink);font-weight:900}
.title .big.long{font-size:calc(var(--fs-big) * .72)}
/* キャラ紹介つきで見出しが 2 行のとき: 詰める */
.title.compact .sub{margin-top:18px;font-size:calc(var(--fs-h) * .8)}
.title.compact .cast{margin-top:22px;gap:80px}
.title.compact .castc svg{width:190px;height:190px}
.title.compact .cname{font-size:34px}
.title.compact .cdesc{font-size:26px;max-width:520px}
/* ---- scene ---- */
/* 物語シーン（scenes.py が {{BODY}} に入れる）。上のピル帯 124px と下の字幕帯を避けた領域に絶対配置する */
.scene{position:absolute;left:0;right:0;top:124px;bottom:calc(var(--subband) + 58px);overflow:hidden;background:var(--paper);--G:548px;z-index:1}
html[data-kind="short"] .scene{--G:835px}
.scene .cam{position:absolute;inset:0;transform-origin:50% 62%}
.scene .layer{position:absolute;left:-160px;top:0;width:calc(100% + 320px);height:100%;display:block;pointer-events:none}
.scene .layer.tint{left:0;width:100%}
.scene .chars,.scene .props{position:absolute;inset:0}
.scene svg text{font-family:inherit}
.scene svg .enter{transform-box:fill-box;transform-origin:center}
/* キャラ: 地面の線（--G）に立つ。--lift はカウンターの奥に立つぶん上げる */
.scene .ch{position:absolute;bottom:calc(100% - var(--G) + var(--lift,0px));width:var(--cs);height:var(--cs);margin-left:calc(var(--cs) / -2)}  /* translate だと stacking context ができて吹き出しが小道具の下に隠れる */
.scene .ch::before{content:"";position:absolute;left:14%;right:14%;bottom:-10px;height:26px;border-radius:50%;background:rgba(31,42,68,.14)}
.scene .ch .bob{position:relative;width:100%;height:100%;transform-origin:50% 97%}
.scene .ch svg.chsvg{width:100%;height:100%;overflow:visible;display:block}
/* カメラ（最初の 1.3 秒。in は寄った状態で止まる） */
@keyframes sc-in{from{transform:scale(1)}to{transform:scale(1.1)}}
@keyframes sc-out{from{transform:scale(1.12)}to{transform:none}}
@keyframes sc-pan{from{transform:translateX(var(--amp))}to{transform:none}}
@keyframes sc-shake{0%{transform:translate(0,0)}8%{transform:translate(-20px,10px)}18%{transform:translate(17px,-8px)}28%{transform:translate(-13px,6px)}40%{transform:translate(9px,-5px)}52%{transform:translate(-6px,3px)}64%{transform:translate(4px,-2px)}78%{transform:translate(-2px,1px)}100%{transform:none}}
.scene[data-cam="in"] .cam{transform:scale(1.1)}
.scene[data-anim="1"][data-cam="in"] .cam{animation:sc-in 1.3s cubic-bezier(.3,.6,.3,1) both}
.scene[data-anim="1"][data-cam="out"] .cam{animation:sc-out 1.3s cubic-bezier(.3,.6,.3,1) both}
.scene[data-anim="1"][data-cam="shake"] .cam{animation:sc-shake .9s linear both}
.scene[data-cam="pan_left"]{--dir:1}.scene[data-cam="pan_right"]{--dir:-1}
.scene .far{--amp:calc(var(--dir,0) * -30px)}.scene .mid{--amp:calc(var(--dir,0) * -60px)}
.scene .near,.scene .fore,.scene .glow,.scene .chars,.scene .props{--amp:calc(var(--dir,0) * -100px)}
.scene[data-anim="1"][data-cam^="pan"] .far,.scene[data-anim="1"][data-cam^="pan"] .mid,.scene[data-anim="1"][data-cam^="pan"] .near,.scene[data-anim="1"][data-cam^="pan"] .fore,
.scene[data-anim="1"][data-cam^="pan"] .glow,.scene[data-anim="1"][data-cam^="pan"] .chars,.scene[data-anim="1"][data-cam^="pan"] .props{animation:sc-pan 1.3s cubic-bezier(.3,.6,.3,1) both}
/* 歩き: 画面外（--from）から at へ。体が上下し、手足（characters.py の leg-a/leg-b/arm-a/arm-b）が交互に上がる。最後は静止ポーズと同じ */
@keyframes sc-walk{from{transform:translateX(var(--from))}to{transform:none}}
@keyframes sc-bob{0%,50%,100%{transform:translateY(0)}25%,75%{transform:translateY(-9px)}}
@keyframes sc-legA{0%,50%,100%{transform:translateY(0)}25%{transform:translateY(var(--lift-y,-12px))}}
@keyframes sc-legB{0%,50%,100%{transform:translateY(0)}75%{transform:translateY(var(--lift-y,-12px))}}
.scene .walkin{animation:sc-walk 1.3s linear both}
.scene .walkin .bob{animation:sc-bob .325s ease-in-out 4 both}
.scene .leg-a,.scene .leg-b,.scene .arm-a,.scene .arm-b{transform-box:fill-box;transform-origin:center}
.scene .arm-a,.scene .arm-b{--lift-y:-7px}
.scene .walkin .leg-a,.scene .walkin .arm-a{animation:sc-legA .325s ease-in-out 4 both}
.scene .walkin .leg-b,.scene .walkin .arm-b{animation:sc-legB .325s ease-in-out 4 both}
/* ポーズの入り（bow: 起きた姿勢から傾く / shock: のけぞる / cheer: 跳ねる） */
@keyframes sc-bowin{from{transform:rotate(calc(var(--lean,0deg) * -1))}to{transform:none}}
@keyframes sc-shockin{0%{transform:rotate(calc(var(--lean,0deg) * -1))}45%{transform:rotate(calc(var(--lean,0deg) * .35)) translateY(-16px)}75%{transform:rotate(calc(var(--lean,0deg) * -.12))}100%{transform:none}}
@keyframes sc-cheerin{0%{transform:translateY(0)}35%{transform:translateY(-50px)}70%{transform:translateY(0)}85%{transform:translateY(-14px)}100%{transform:none}}
.scene .posein.act-bow .bob{animation:sc-bowin .6s ease-out both .15s}
.scene .posein.act-shock .bob{animation:sc-shockin .7s ease-out both}
.scene .posein.act-cheer .bob{animation:sc-cheerin .9s ease-out both}
/* 白フチ文字（::before に同じ文字を太い白ストロークで置く） */
.scene .ot{position:relative;display:inline-block;z-index:0;white-space:inherit}
.scene .ot::before{content:attr(data-t);position:absolute;left:0;top:0;width:100%;-webkit-text-stroke:var(--ow,16px) #fff;color:#fff;z-index:-1;text-shadow:0 8px 0 rgba(31,42,68,.14);white-space:inherit}
/* 大テロップ（画面上部中央。カメラの外） */
.scene .hl{position:absolute;left:0;right:0;margin:0 auto;width:max-content;top:6px;max-width:calc(100% - 100px);text-align:center;font-weight:900;line-height:1.15;color:var(--accent);z-index:9;white-space:pre-wrap;letter-spacing:.02em}
/* 吹き出し（キャラの頭の上、内側へ寄せる。l/r/c は立ち位置） */
.scene .bub{position:absolute;bottom:calc(100% - var(--bo,96px));font-size:54px;font-weight:900;line-height:1.2;color:var(--ink);background:#fff;border:5px solid var(--ink);border-radius:30px;padding:12px 30px;white-space:nowrap;box-shadow:0 8px 0 rgba(31,42,68,.14);z-index:7}
.scene .bub.wrap{white-space:pre-wrap;width:max-content;max-width:640px}
.scene .bub.l{left:4%}.scene .bub.r{right:4%}.scene .bub.c{left:50%;translate:-50% 0}
.scene .bub::after{content:"";position:absolute;bottom:-21px;width:30px;height:30px;background:#fff;border-right:5px solid var(--ink);border-bottom:5px solid var(--ink);transform:rotate(45deg)}
.scene .bub.l::after{left:60px}.scene .bub.r::after{right:60px}.scene .bub.c::after{left:50%;margin-left:-15px}
html[data-kind="short"] .scene .bub{font-size:48px;--bo:110px}
html[data-kind="short"] .scene .bub.wrap{max-width:560px}
/* 頭上の印（汗・！・？・♥・zzz・☆） */
.scene .hm{position:absolute;top:22%;width:130px;height:130px;z-index:7}
.scene .hm.l,.scene .hm.c{left:70%}.scene .hm.r{right:70%}
.scene .hm-svg{width:100%;height:100%;overflow:visible;display:block}
/* 小道具: --x は横位置（%）。浮くものは --y、ground は地面、hang は上から吊る */
.scene .prop{position:absolute;left:var(--x,50%);--st:calc(var(--stack,0) * 170px);top:calc(var(--y,43%) + var(--st));translate:-50% -50%;z-index:6;transform-origin:50% 50%;width:max-content}
html[data-kind="short"] .scene .prop{--y:33%}
.scene .prop.ground{top:auto;bottom:calc(100% - var(--G));translate:-50% 0;transform-origin:50% 100%}
.scene .prop.hang{top:var(--st);translate:-50% 0;transform-origin:50% 0}
/* 大テロップがある場面: 吊り物はテロップの下から、浮く物と写真は少し下へ、吹き出しは頭の横へ */
.scene.has-hl .prop.hang{top:calc(104px + var(--st))}
html[data-kind="short"] .scene.has-hl .prop.hang{top:calc(200px + var(--st))}
.scene.has-hl .prop:not(.hang):not(.ground){--y:52%}
html[data-kind="short"] .scene.has-hl .prop:not(.hang):not(.ground){--y:40%}
.scene.has-hl .p-photo{--y:57%}
.scene .photo img,.scene .photo .ph-empty{height:360px}
.scene .price{display:flex;flex-direction:column;align-items:center}
.scene .price .string{width:6px;height:var(--sl,140px);background:#B5651D;border-radius:3px}
html[data-kind="short"] .scene .price .string{--sl:200px}
.scene .price .tag{position:relative;background:#fff;border:6px solid var(--ink);border-radius:26px;padding:16px 50px 22px;font-weight:900;color:var(--accent);line-height:1.05;white-space:nowrap;
  box-shadow:0 10px 0 rgba(31,42,68,.16);rotate:-5deg;transform-origin:50% 0;font-variant-numeric:tabular-nums}
.scene .price .tag::before{content:"";position:absolute;left:50%;top:-14px;width:24px;height:24px;border-radius:50%;background:var(--paper);border:5px solid var(--ink);translate:-50% 0;box-sizing:border-box}
.scene .sign{display:flex;flex-direction:column;align-items:center}
.scene .sign .board{background:#fff;border:6px solid var(--ink);border-radius:18px;padding:14px 40px;font-weight:900;line-height:1.2;color:var(--accent);box-shadow:0 8px 0 rgba(31,42,68,.14);max-width:560px;text-align:center;white-space:pre-wrap}
.scene .sign .post{width:34px;height:150px;background:#B5651D;border:5px solid var(--ink);border-top:0;border-radius:0 0 8px 8px;margin-top:-4px}
.scene .arrow{display:flex;flex-direction:column;align-items:center;gap:4px}
.scene .arrow .lbl{font-size:60px;font-weight:900;color:var(--ink);white-space:nowrap;--ow:12px}
.scene .arrow svg{filter:drop-shadow(0 8px 0 rgba(31,42,68,.14))}
.scene .cal{width:340px;background:#fff;border:6px solid var(--ink);border-radius:22px;box-shadow:0 10px 0 rgba(31,42,68,.14);position:relative}
.scene .cal .top{height:64px;background:#D7263D;border-radius:16px 16px 0 0;border-bottom:6px solid var(--ink);position:relative}
.scene .cal .top::before,.scene .cal .top::after{content:"";position:absolute;top:-22px;width:22px;height:48px;border-radius:11px;background:#9E9E9E;border:5px solid var(--ink);box-sizing:border-box}
.scene .cal .top::before{left:60px}.scene .cal .top::after{right:60px}
.scene .cal .d{font-weight:900;text-align:center;padding:18px 16px 24px;color:var(--ink);line-height:1.1;white-space:pre-wrap}
.scene .stamp{width:320px;height:320px;border:12px solid #D7263D;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#D7263D;font-weight:900;rotate:-14deg;
  box-shadow:inset 0 0 0 8px #fff,inset 0 0 0 16px #D7263D;background:rgba(255,255,255,.88);letter-spacing:.04em;line-height:1;text-align:center;white-space:pre-wrap}
.scene .coins-prop svg,.scene .money svg{display:block;filter:drop-shadow(0 6px 0 rgba(31,42,68,.14))}
.scene .money{display:flex;flex-direction:column;align-items:center}
.scene .money .lbl{font-size:72px;font-weight:900;color:var(--green);margin-top:-30px;--ow:14px;white-space:nowrap}
.scene .big-mark{width:360px;height:360px;display:block;filter:drop-shadow(0 10px 0 rgba(31,42,68,.14))}
html[data-kind="short"] .scene .big-mark{width:320px;height:320px}
.scene .photo{background:#fff;padding:18px 18px 8px;border:5px solid var(--ink);border-radius:8px;box-shadow:0 10px 0 rgba(31,42,68,.14);rotate:-4deg;width:560px}
.scene .photo img,.scene .photo .ph-empty{width:100%;height:400px;object-fit:cover;display:block}
.scene .photo .ph-empty{display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(45deg,#eee 0 20px,#e4e0d8 20px 40px);color:var(--mute);font-size:40px;font-weight:700;text-align:center;padding:0}
.scene .photo .cap{font-size:38px;font-weight:900;text-align:center;padding:12px 0 6px;color:var(--ink);line-height:1.2;margin:0}
html[data-kind="short"] .scene .photo{width:520px}
html[data-kind="short"] .scene .photo img,html[data-kind="short"] .scene .photo .ph-empty{height:380px}
.scene .cnt{background:#fff;border:6px solid var(--ink);border-radius:26px;padding:10px 44px 16px;text-align:center;box-shadow:0 10px 0 rgba(31,42,68,.14);white-space:nowrap}
.scene .cnt .lb{font-size:38px;font-weight:900;color:var(--mute);line-height:1.2}
.scene .cnt .v{font-size:104px;font-weight:900;color:var(--accent);line-height:1.1;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.scene .cnt .v small{font-size:46px;color:var(--ink);margin-left:8px}
/* ---- /scene ---- */
</style></head>
<body>
<div class="stage">
  <div class="top"><div class="q">問い：{{QUESTION}}</div><div class="chap">{{CHAPTER}}</div></div>
  <div class="body">{{BODY}}</div>
  <div class="foot">{{DISCLAIMER}}</div>
</div>
<script>
// 外部（render_frames.js）から時刻を指定され、その時点の画を作る。再生は使わない。
(function(){
  const ease = t => t<0?0:t>1?1:1-Math.pow(1-t,3);
  const fmt = (v, dec) => v.toLocaleString('ja-JP',{minimumFractionDigits:dec,maximumFractionDigits:dec});
  window.__seek = function(ms){
    void document.body.offsetHeight;   // スタイルを確定させてからアニメを拾う
    document.getAnimations().forEach(a => { a.pause(); a.currentTime = ms; });
    document.querySelectorAll('[data-count-to]').forEach(el => {
      const from = +el.dataset.countFrom || 0, to = +el.dataset.countTo, dur = +el.dataset.countDur || 1800, delay = +el.dataset.countDelay || 200;
      const dec = +el.dataset.countDec || 0;
      const v = from + (to - from) * ease((ms - delay) / dur);
      el.textContent = (el.dataset.prefix || '') + fmt(Math.round(v * Math.pow(10,dec)) / Math.pow(10,dec), dec);
    });
  };
  if (location.search.indexOf('static') >= 0) window.__seek(1e7);   // Chrome の静止画撮影用
})();
</script>
</body></html>
