<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<style>
:root{--paper:#FFF8E7;--ink:#1F2A44;--accent:#FF7A1A;--gold:#F2B705;--green:#1FA463;--black:#15192B}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:{{W}}px;height:{{H}}px;overflow:hidden;background:var(--paper);position:relative;
  font-family:"{{FONT}}","Noto Sans JP","BIZ UDPGothic","Meiryo","IPAPGothic",sans-serif;color:var(--ink)}
body::before{content:"";position:absolute;inset:0;pointer-events:none;
  background-image:radial-gradient(rgba(255,122,26,.16) 3px,transparent 3.5px);background-size:44px 44px}
/* 右側の斜めの濃い帯（キャラの背景） */
body::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(112deg,transparent 0 64%,var(--ink) 64% 100%)}
.wrap{position:absolute;inset:0;padding:44px 56px 48px;display:flex;flex-direction:column;justify-content:space-between;z-index:1}
.tag{display:inline-block;font-size:36px;font-weight:900;color:#fff;background:var(--accent);padding:10px 30px;border-radius:999px;align-self:flex-start;
  box-shadow:0 6px 0 rgba(31,42,68,.25)}
/* 大きな文字 2 行: 紺＋白縁＋影（スマホ一覧 120px 幅でも読めるよう太く・大きく） */
.big{font-size:140px;font-weight:900;line-height:1.05;letter-spacing:-.03em;white-space:pre-line;max-width:66%;
  -webkit-text-stroke:7px #fff;paint-order:stroke fill;text-shadow:0 10px 0 rgba(31,42,68,.18),0 0 24px rgba(255,255,255,.9)}
/* 黒帯のひと言: 白文字、要点は金 */
.sub{font-size:56px;font-weight:900;color:#fff;background:var(--black);display:inline-block;padding:16px 36px;border-radius:16px;align-self:flex-start;white-space:pre-line;
  line-height:1.25;max-width:66%;box-shadow:0 8px 0 rgba(31,42,68,.3);border:4px solid #fff}
/* キャラクター置き場（右）。{{CHAR}} に SVG が入る。空のときは丸印「大家」を出す */
.char{position:absolute;right:36px;bottom:0;width:420px;height:600px;display:flex;align-items:flex-end;justify-content:center;z-index:2;pointer-events:none}
.char>svg,.char>img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 10px 0 rgba(0,0,0,.25))}
.char:empty{align-items:center;justify-content:center;height:340px;bottom:40px}
.char:empty::before{content:"大家";width:240px;height:240px;border-radius:50%;background:#fff;border:14px solid var(--accent);
  display:flex;align-items:center;justify-content:center;font-size:92px;font-weight:900;color:var(--ink);box-shadow:0 10px 0 rgba(0,0,0,.3)}
/* ショート（縦長）のとき: 文字を上、キャラを下に */
@media (max-aspect-ratio: 1/1){
  body::after{background:linear-gradient(180deg,transparent 0 58%,var(--ink) 58% 100%)}
  .wrap{padding:72px 56px 60px;justify-content:flex-start;gap:40px}
  .big{font-size:150px;max-width:100%}
  .sub{font-size:68px;max-width:100%}
  .char{right:0;left:0;margin:0 auto;width:720px;height:800px}
}
</style></head>
<body><div class="wrap"><div class="tag">{{TAG}}</div><div class="big">{{BIG}}</div><div class="sub">{{SUB}}</div></div>
<div class="char">{{CHAR}}</div>
<script>
// make_video.py がまだ CHAR を差し込まない場合は、差し込み記号が文字のまま残らないよう空にする
(function(){var c=document.querySelector('.char');if(c&&c.textContent.trim()==='{{'+'CHAR}}')c.textContent='';})();
</script>
</body></html>
